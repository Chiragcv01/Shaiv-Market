<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0284C7">
<meta name="robots" content="noindex,nofollow">
<title>MFD CRM · Shaiv Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --sky-50:#F0F9FF;--sky-100:#E0F2FE;--sky-200:#BAE6FD;--sky-300:#7DD3FC;--sky-400:#38BDF8;--sky-500:#0EA5E9;--sky-600:#0284C7;--sky-700:#0369A1;--sky-800:#075985;--sky-900:#0C4A6E;
  --ink:#0F172A;--ink2:#334155;--mute:#64748B;--line:#E2E8F0;--bg:#F6FBFF;--card:#fff;
  --pos:#16A34A;--neg:#DC2626;--hi:#E11D48;--md:#F59E0B;--lo:#0EA5E9;
  --r:14px;--sh:0 1px 2px rgba(2,132,199,.06),0 4px 16px rgba(2,132,199,.07);
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 500px at 90% -10%,#DFF3FF 0,transparent 60%),radial-gradient(900px 400px at -10% 10%,#EAF7FF 0,transparent 55%),var(--bg);min-height:100vh}
a{color:var(--sky-700);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mute{color:var(--mute)}.small{font-size:12px}.tiny{font-size:11px}.b{font-weight:700}.nowrap{white-space:nowrap}.right{text-align:right}.center{text-align:center}
.hide{display:none!important}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--sky-400),var(--sky-700));display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;box-shadow:0 6px 16px rgba(2,132,199,.35)}
.brand .t1{font-weight:800;font-size:15px;letter-spacing:-.2px}.brand .t2{font-size:11px;color:var(--mute)}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink2);font-weight:600}
.nav a:hover{background:var(--sky-50)}
.nav a.on{background:linear-gradient(90deg,var(--sky-100),var(--sky-50));color:var(--sky-800)}
.nav a .cnt{margin-left:auto;background:var(--hi);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px}
.side .foot{margin-top:auto;font-size:11px;color:var(--mute);padding:10px 8px;border-top:1px solid var(--line)}
main{min-width:0;padding:22px 28px 90px;max-width:1320px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar h1{font-size:22px;margin:0;letter-spacing:-.4px}
.topbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2)}
.chip.live::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.chip.off::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--md)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink2);padding:8px 13px;border-radius:10px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--sky-300);color:var(--sky-800)}
.btn.pri{background:linear-gradient(135deg,var(--sky-500),var(--sky-600));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(2,132,199,.25)}
.btn.pri:hover{filter:brightness(1.05);color:#fff}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.wa{background:#22C55E;color:#fff;border-color:transparent}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.5;cursor:default}
.mnav{display:none}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px;letter-spacing:-.1px}
.card h3 .sp{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.span2{grid-column:span 2}
.hero{background:linear-gradient(120deg,var(--sky-600),var(--sky-500) 55%,var(--sky-400));color:#fff;border-radius:18px;padding:22px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(2,132,199,.25)}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:'';position:absolute;right:120px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .hi{font-size:13px;opacity:.9}.hero .big{font-size:34px;font-weight:800;letter-spacing:-1px;margin:4px 0}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:16px;position:relative;z-index:1}
.kpi{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:10px 12px;backdrop-filter:blur(4px)}
.kpi .l{font-size:11px;opacity:.85;display:flex;gap:6px;align-items:center}.kpi .v{font-size:18px;font-weight:800;margin-top:2px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .l{font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:flex;gap:6px;align-items:center}
.tile .v{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.3px}
.tile .s{font-size:12px;color:var(--mute)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.p3{background:#FFE4E6;color:#BE123C}.p2{background:#FEF3C7;color:#B45309}.p1{background:var(--sky-100);color:var(--sky-800)}
.tp{background:var(--sky-50);color:var(--sky-800);border:1px solid var(--sky-200)}
.prof{background:var(--sky-100);color:var(--sky-800)}
.st-done{background:#DCFCE7;color:#166534}.st-dismissed{background:#F1F5F9;color:#475569}.st-snooze{background:#FEF9C3;color:#854D0E}

/* recs */
.rec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:start;transition:box-shadow .15s}
.rec:hover{box-shadow:var(--sh)}
.rec+.rec{margin-top:10px}
.rec .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff}
.rec .ttl{font-weight:700;font-size:14px}
.rec .why{color:var(--ink2);font-size:13px;margin-top:2px}
.rec .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.rec .imp{text-align:right;font-weight:800;color:var(--sky-800);font-size:15px}
.rec .imp small{display:block;font-weight:500;color:var(--mute);font-size:10px;max-width:120px}
.rec details{grid-column:2/4;margin-top:2px}
.rec summary{cursor:pointer;color:var(--sky-700);font-weight:600;font-size:12px;list-style:none}
.rec summary::-webkit-details-marker{display:none}
.rec ol,.rec ul{margin:8px 0;padding-left:20px}.rec li{margin:4px 0;font-size:13px}
.rec .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rec.dim{opacity:.55}
.box{background:var(--sky-50);border:1px solid var(--sky-100);border-radius:10px;padding:10px 12px;margin-top:8px}
.box h4{margin:0 0 4px;font-size:12px;color:var(--sky-800);text-transform:uppercase;letter-spacing:.4px}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFDFF;position:sticky;top:0}
.t td{padding:9px 8px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
.t tr:hover td{background:#FAFDFF}
.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fn{font-weight:600;min-width:190px}.fn small{display:block;font-weight:500;color:var(--mute);font-size:11px}
.bar{height:6px;border-radius:99px;background:var(--sky-100);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky-400),var(--sky-600));border-radius:99px}

/* client cards */
.ccard{cursor:pointer;display:flex;flex-direction:column;gap:10px}
.ccard:hover{border-color:var(--sky-300)}
.av{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--sky-200),var(--sky-400));color:var(--sky-900);font-weight:800;display:grid;place-items:center;flex:none}
.row{display:flex;align-items:center;gap:10px}.row .sp{flex:1}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mini div{background:var(--sky-50);border-radius:8px;padding:6px 8px}.mini b{display:block;font-size:13px}.mini span{font-size:10px;color:var(--mute);text-transform:uppercase}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--sky-700);border-bottom-color:var(--sky-500)}
.tabs .cnt{background:var(--hi);color:#fff;border-radius:99px;font-size:10px;padding:0 6px}

/* forms */
.f{display:grid;gap:12px}.f.c2{grid-template-columns:1fr 1fr}.f.c3{grid-template-columns:1fr 1fr 1fr}
label.l{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink2)}
label.l small{font-weight:400;color:var(--mute)}
.in{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;width:100%;outline:none}
.in:focus{border-color:var(--sky-400);box-shadow:0 0 0 3px var(--sky-100)}
.sec{font-size:12px;font-weight:800;color:var(--sky-800);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 4px;grid-column:1/-1;display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;background:var(--sky-50);border:1px solid var(--sky-100);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-weight:600;color:var(--mute);font-size:12px}
.seg button.on{background:#fff;color:var(--sky-800);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search-res{border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;margin-top:6px;background:#fff}
.search-res div{padding:8px 10px;border-bottom:1px solid #F1F5F9;cursor:pointer;font-size:13px}
.search-res div:hover{background:var(--sky-50)}
.search-res div small{color:var(--mute)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(12,74,110,.35);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal .dlg{background:#fff;border-radius:16px;width:min(760px,100%);box-shadow:0 20px 60px rgba(2,132,199,.3);overflow:hidden}
.modal .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--sky-50),#fff)}
.modal .hd h2{margin:0;font-size:16px;flex:1}
.modal .bd{padding:16px 18px;max-height:calc(100vh - 200px);overflow:auto}
.modal .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:#FAFDFF}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--sky-900);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.prog{height:4px;background:var(--sky-100);border-radius:99px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--sky-500);transition:width .2s}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:#fff;border:1px dashed var(--sky-300);margin-bottom:14px;flex-wrap:wrap}
.banner .sp{flex:1}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.empty .ill{width:84px;height:84px;margin:0 auto 12px;border-radius:24px;background:linear-gradient(135deg,var(--sky-100),var(--sky-200));display:grid;place-items:center;color:var(--sky-700)}
.empty .ill svg{width:40px;height:40px}
.chart{position:relative;height:230px}.chart.sm{height:170px}.chart.lg{height:300px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.alloc{display:grid;grid-template-columns:90px 1fr 54px 54px;gap:8px;align-items:center;font-size:12px;margin:8px 0}
.alloc .tr{position:relative;height:10px;border-radius:99px;background:#F1F5F9}
.alloc .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.alloc .tr b{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--sky-500) calc(var(--p)*1%),var(--sky-100) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.mk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mk .m{border:1px solid var(--line);border-radius:12px;padding:10px}
.mk .m .n{font-size:12px;color:var(--mute);font-weight:600}.mk .m .v{font-weight:800;font-size:16px}
.lock{position:fixed;inset:0;background:linear-gradient(135deg,var(--sky-600),var(--sky-400));z-index:100;display:grid;place-items:center}
.lock .bx{background:#fff;border-radius:18px;padding:26px;width:min(340px,90vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.lock input{font-size:22px;letter-spacing:8px;text-align:center}
.note{font-size:12px;color:var(--mute);background:#FAFDFF;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.loglist div{padding:8px 0;border-bottom:1px solid #F1F5F9;font-size:13px}.loglist small{color:var(--mute)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .in{width:auto}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}.kv span{color:var(--mute)}.kv b{text-align:right}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}.side{display:none}
  main{padding:14px 12px 96px}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -4px 20px rgba(2,132,199,.08)}
  .mnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--mute);padding:4px 6px;border-radius:8px;position:relative}
  .mnav a.on{color:var(--sky-700);background:var(--sky-50)}
  .mnav a .cnt{position:absolute;top:0;right:2px;background:var(--hi);color:#fff;font-size:9px;border-radius:99px;padding:0 4px}
  .g2,.g3{grid-template-columns:1fr}.span2{grid-column:auto}
  .kpis{grid-template-columns:repeat(2,1fr)}.hero .big{font-size:28px}
  .f.c2,.f.c3{grid-template-columns:1fr}
  .rec{grid-template-columns:34px 1fr}.rec .imp{grid-column:2;text-align:left}.rec details{grid-column:1/3}
  .mk{grid-template-columns:1fr}
  .topbar h1{font-size:19px}
  .modal{padding:0}.modal .dlg{border-radius:0;min-height:100vh}.modal .bd{max-height:none}
  .hidem{display:none!important}
}

/* print report */
#print{display:none}
@media print{
  body{background:#fff}
  .app,.mnav,.modal,#toast,.lock{display:none!important}
  #print{display:block;font-size:11px;color:#0F172A}
  @page{size:A4;margin:12mm}
}
.pr-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:linear-gradient(120deg,#0284C7,#38BDF8);color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pr-h .logo{box-shadow:none;background:#fff;color:#0284C7}
.pr-sec{margin-top:14px;break-inside:avoid}
.pr-sec h2{font-size:13px;color:#075985;border-bottom:2px solid #BAE6FD;padding-bottom:4px;margin:0 0 8px}
.pr-k{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pr-k div{border:1px solid #BAE6FD;border-radius:8px;padding:8px;background:#F0F9FF;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pr-k b{display:block;font-size:14px}
.pr-rec{border:1px solid #E2E8F0;border-left:4px solid #0EA5E9;border-radius:8px;padding:8px 10px;margin-bottom:6px;break-inside:avoid}
#print table{width:100%;border-collapse:collapse}#print th,#print td{border-bottom:1px solid #E2E8F0;padding:4px 5px;text-align:left}#print th{background:#F0F9FF;font-size:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#print img{max-width:100%}
.pr-disc{font-size:9px;color:#64748B;margin-top:14px;border-top:1px solid #E2E8F0;padding-top:8px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo" id="brandLogo">S</div><div><div class="t1" id="brandName">Shaiv Market</div><div class="t2">MFD Command Centre</div></div></div>
    <nav class="nav">
      <a href="#dashboard" data-nav="dashboard"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Dashboard</a>
      <a href="#clients" data-nav="clients"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"/></svg>Clients</a>
      <a href="#opps" data-nav="opps"><svg class="i" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Opportunities<span class="cnt hide">0</span></a>
      <a href="#funds" data-nav="funds"><svg class="i" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/></svg>Fund research</a>
      <a href="#tools" data-nav="tools"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8 6.5h8M8 11h8M8 15h8"/></svg>Calculators</a>
      <a href="#settings" data-nav="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Settings</a>
    </nav>
    <div class="foot" id="sideFoot">Live data: AMFI NAV (mfapi.in)</div>
  </aside>
  <main id="main"></main>
</div>
<nav class="mnav">

<script>/* --- util.js --- */
/* ===== Utilities ===== */
const DAY = 864e5;
const YEAR = 365 * DAY;
const U = {
  $: (s, r = document) => r.querySelector(s),
  $$: (s, r = document) => [...r.querySelectorAll(s)],
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  num: v => { const n = parseFloat(String(v ?? '').replace(/[,₹\s]/g, '')); return isFinite(n) ? n : 0; },
  inr(n, d = 0) {
    if (n == null || !isFinite(n)) return '—';
    const neg = n < 0; n = Math.abs(n);
    return (neg ? '-' : '') + '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: d, minimumFractionDigits: d });
  },
  inrS(n) {
    if (n == null || !isFinite(n)) return '—';
    const neg = n < 0, a = Math.abs(n); let s;
    if (a >= 1e7) s = (a / 1e7).toFixed(2) + ' Cr';
    else if (a >= 1e5) s = (a / 1e5).toFixed(2) + ' L';
    else if (a >= 1e3) s = (a / 1e3).toFixed(1) + 'K';
    else s = a.toFixed(0);
    return (neg ? '-' : '') + '₹' + s;
  },
  pct: (n, d = 1) => (n == null || !isFinite(n)) ? '—' : (n * 100).toFixed(d) + '%',
  pctS: (n, d = 1) => (n == null || !isFinite(n)) ? '—' : (n >= 0 ? '+' : '') + (n * 100).toFixed(d) + '%',
  cls: n => n == null || !isFinite(n) ? '' : (n >= 0 ? 'pos' : 'neg'),
  parseDMY(s) { const [d, m, y] = s.split('-'); return Date.UTC(+y, +m - 1, +d); },
  parseISO(s) { if (!s) return null; const [y, m, d] = String(s).split('-'); if (!y || !m) return null; return Date.UTC(+y, +m - 1, +(d || 1)); },
  today() { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); },
  todayKey() { return U.iso(U.today()); },
  iso: ms => new Date(ms).toISOString().slice(0, 10),
  fmtDate: ms => ms == null ? '—' : new Date(ms).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' }),
  fmtMon: ms => new Date(ms).toLocaleDateString('en-IN', { month: 'short', year: '2-digit', timeZone: 'UTC' }),
  uid: () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4),
  dim: (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate(),
  fyStart(ms = U.today()) { const d = new Date(ms); const y = d.getUTCMonth() >= 3 ? d.getUTCFullYear() : d.getUTCFullYear() - 1; return Date.UTC(y, 3, 1); },
  fyEnd(ms = U.today()) { return Date.UTC(new Date(U.fyStart(ms)).getUTCFullYear() + 1, 2, 31); },
  fyLabel(ms = U.today()) { const y = new Date(U.fyStart(ms)).getUTCFullYear(); return `FY ${y}-${String(y + 1).slice(2)}`; },
  age(dob) { const t = U.parseISO(dob); if (!t) return null; return Math.floor((U.today() - t) / (365.25 * DAY)); },
  median(a) { const b = a.filter(x => x != null && isFinite(x)).sort((x, y) => x - y); if (!b.length) return null; const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; },
  // fraction of values strictly below v (+ half ties) -> 0..1, higher = better if higherBetter
  pr(arr, v, higherBetter = true) {
    const a = arr.filter(x => x != null && isFinite(x));
    if (v == null || !isFinite(v) || !a.length) return null;
    let below = 0, eq = 0; a.forEach(x => { if (x < v) below++; else if (x === v) eq++; });
    const p = (below + eq / 2) / a.length;
    return higherBetter ? p : 1 - p;
  },
  xirr(flows) {
    // flows: [{t, v}] (v<0 investment, v>0 value)
    if (!flows.length) return null;
    const t0 = Math.min(...flows.map(f => f.t));
    const f = r => flows.reduce((s, x) => s + x.v / Math.pow(1 + r, (x.t - t0) / YEAR), 0);
    let lo = -0.99, hi = 10, flo = f(lo), fhi = f(hi);
    if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return null;
    for (let i = 0; i < 200; i++) {
      const mid = (lo + hi) / 2, fm = f(mid);
      if (Math.abs(fm) < 1e-6) return mid;
      if (flo * fm < 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
    }
    return (lo + hi) / 2;
  },
  debounce(fn, ms = 300) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  toast(msg, ms = 2600) {
    let el = U.$('#toast'); if (!el) return;
    el.textContent = msg; el.classList.add('show');
    clearTimeout(U._tt); U._tt = setTimeout(() => el.classList.remove('show'), ms);
  },
  ls: {
    get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { } }
  },
  async sha(s) {
    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
    catch (e) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return 'x' + h; }
  },
  download(name, text, type = 'application/json') {
    try {
      const blob = new Blob([text], { type }); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    } catch (e) { U.toast('Download blocked: ' + e.message); }
  },
  phone10: p => String(p || '').replace(/\D/g, '').slice(-10),
  wa(phone, text) { const p = U.phone10(phone); return `https://wa.me/${p ? '91' + p : ''}?text=${encodeURIComponent(text)}`; }
};

/* IndexedDB tiny KV cache (NAV histories) */
U.idb = {
  _db: null,
  open() {
    if (this._db) return this._db;
    this._db = new Promise(res => {
      try {
        const r = indexedDB.open('smcrm', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
    return this._db;
  },
  async get(k) {
    const db = await this.open(); if (!db) return null;
    return new Promise(res => { try { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); } catch (e) { res(null); } });
  },
  async set(k, v) {
    const db = await this.open(); if (!db) return;
    return new Promise(res => { try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch (e) { res(); } });
  },
  async clear() {
    const db = await this.open(); if (!db) return;
    return new Promise(res => { try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').clear(); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch (e) { res(); } });
  }
};

/* --- api.js --- */
/* ===== Live data: AMFI NAVs via mfapi.in (free, no key) ===== */
const API = {
  base: 'https://api.mfapi.in',
  mem: new Map(),        // key -> parsed history
  inflight: new Map(),
  q: [], active: 0, max: 6,
  online: true,
  stats: { fetched: 0, cached: 0, failed: 0 },

  _run(fn) {
    return new Promise((res, rej) => {
      const go = async () => {
        this.active++;
        try { res(await fn()); } catch (e) { rej(e); }
        finally { this.active--; const n = this.q.shift(); if (n) n(); }
      };
      if (this.active < this.max) go(); else this.q.push(go);
    });
  },
  async _json(url, tries = 2) {
    for (let i = 0; i <= tries; i++) {
      try {
        const r = await fetch(url, { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json(); this.online = true; return j;
      } catch (e) {
        if (i === tries) { this.online = false; throw e; }
        await new Promise(r => setTimeout(r, 600 * (i + 1)));
      }
    }
  },
  /* Full AMFI scheme list (mfapi /mf). The /mf/search endpoint returns only ~15 (mostly old) rows,
     so all searching is done locally on this list. Cached 7 days in IndexedDB. */
  _list: null, _listP: null, listErr: null,
  norm: s => String(s || '').toLowerCase().replace(/&/g, ' and ').replace(/[-–_.,()/]/g, ' ').replace(/\s+/g, ' ').trim(),
  async list(force = false) {
    if (this._list && !force) return this._list;
    if (this._listP && !force) return this._listP;
    this._listP = (async () => {
      const c = await U.idb.get('schemes');
      if (c && !force && c.rows && c.rows.length > 5000 && U.today() - U.parseISO(c.day) < 7 * DAY) { this._list = c.rows; return c.rows; }
      try {
        let arr = await this._json(`${this.base}/mf`);
        if (!Array.isArray(arr)) arr = [];
        if (arr.length < 5000) { // paginate fallback
          arr = []; for (let off = 0; off < 200000; off += 5000) { const p = await this._json(`${this.base}/mf?limit=5000&offset=${off}`); if (!Array.isArray(p) || !p.length) break; arr.push(...p); if (p.length < 5000) break; }
        }
        const rows = arr.filter(s => s && s.schemeCode && s.schemeName).map(s => [+s.schemeCode, String(s.schemeName).trim()]);
        if (rows.length < 1000) throw new Error('Scheme list incomplete (' + rows.length + ')');
        this._list = rows; this.listErr = null; U.idb.set('schemes', { day: U.todayKey(), rows });
        return rows;
      } catch (e) {
        this.listErr = e.message;
        if (c && c.rows) { this._list = c.rows; return c.rows; }
        this._listP = null; throw e;
      }
    })();
    return this._listP;
  },
  /* every word of q must appear in the scheme name (space-insensitive: "flexicap" = "flexi cap") */
  matchAll(rows, q) {
    const toks = this.norm(q).split(' ').filter(Boolean);
    return rows.filter(([, n]) => { const a = this.norm(n), b = a.replace(/ /g, ''); return toks.every(t => a.includes(t) || b.includes(t)); });
  },
  rank(list) {
    // live share classes (post-2013 names say Regular/Direct) and Growth first, newer codes first
    const pref = (typeof App !== 'undefined' && App.state && App.state.settings.plan === 'direct') ? /direct/i : /regular/i;
    const sc = n => (/regular|direct/i.test(n) ? 4 : 0) + (/growth/i.test(n) ? 2 : 0) + (pref.test(n) ? 1 : 0) - (M.BAD_NAME.test(n) ? 3 : 0);
    return list.sort((a, b) => sc(b.schemeName) - sc(a.schemeName) || b.schemeCode - a.schemeCode);
  },
  async search(q) {
    q = String(q || '').trim(); if (q.length < 2) return [];
    const k = 's:' + q.toLowerCase();
    if (this.mem.has(k)) return this.mem.get(k);
    let arr = null;
    try { const rows = await this.list(); arr = this.matchAll(rows, q).map(([schemeCode, schemeName]) => ({ schemeCode, schemeName })); }
    catch (e) { arr = null; }
    if (!arr) { const j = await this._run(() => this._json(`${this.base}/mf/search?q=${encodeURIComponent(q)}`)); arr = Array.isArray(j) ? j : []; }
    arr = this.rank(arr).slice(0, 300);
    this.mem.set(k, arr); return arr;
  },
  parse(code, j) {
    const pts = (j.data || []).map(r => [U.parseDMY(r.date), parseFloat(r.nav)]).filter(p => p[1] > 0 && isFinite(p[0]));
    pts.sort((a, b) => a[0] - b[0]);
    // dedupe same dates
    const t = [], v = [];
    pts.forEach(p => { if (t.length && t[t.length - 1] === p[0]) { v[v.length - 1] = p[1]; } else { t.push(p[0]); v.push(p[1]); } });
    const meta = j.meta || {};
    return { code: String(code), meta, name: meta.scheme_name || '', amc: meta.fund_house || '', cat: meta.scheme_category || '', t, v, lastT: t[t.length - 1], lastV: v[v.length - 1] };
  },
  /* mode 'full' (complete history) or '6y' (enough for screening) */
  async history(code, mode = 'full', force = false) {
    code = String(code);
    const full = this.mem.get('hf:' + code);
    if (!force && full) return full;
    const key = (mode === 'full' ? 'hf:' : 'h6:') + code;
    if (!force && this.mem.has(key)) return this.mem.get(key);
    if (this.inflight.has(key)) return this.inflight.get(key);
    const p = (async () => {
      const day = U.todayKey();
      const cached = await U.idb.get(key) || (mode === '6y' ? await U.idb.get('hf:' + code) : null);
      if (cached && cached.day === day && !force) { this.stats.cached++; this.mem.set(key, cached.h); return cached.h; }
      try {
        let url = `${this.base}/mf/${code}`;
        if (mode === '6y') url += `?startDate=${U.iso(U.today() - 6.2 * YEAR)}&endDate=${day}`;
        const j = await this._run(() => this._json(url));
        if (!j || !j.data || !j.data.length) throw new Error('No NAV data');
        const h = this.parse(code, j);
        this.stats.fetched++;
        this.mem.set(key, h); U.idb.set(key, { day, h });
        return h;
      } catch (e) {
        this.stats.failed++;
        if (cached) { this.mem.set(key, cached.h); cached.h.stale = cached.day; return cached.h; }
        throw e;
      } finally { this.inflight.delete(key); }
    })();
    this.inflight.set(key, p);
    return p;
  },
  /* choose best scheme from search results */
  pickPlan(list, plan = 'regular') {
    const ok = list.filter(s => /growth/i.test(s.schemeName) && !M.BAD_NAME.test(s.schemeName));
    const pl = ok.filter(s => plan === 'direct' ? /direct/i.test(s.schemeName) : !/direct/i.test(s.schemeName));
    pl.sort((a, b) => (/regular/i.test(b.schemeName) ? 1 : 0) - (/regular/i.test(a.schemeName) ? 1 : 0) || a.schemeName.length - b.schemeName.length);
    return pl[0] || ok[0] || list[0] || null;
  }
};

/* --- metrics.js --- */
/* ===== Fund metrics, SEBI categories, peer screener ===== */
const M = {
  BAD_NAME: /idcw|dividend|bonus|payout|reinvest|segregat|unclaimed|fixed term|\bfmp\b|series|interval|institutional|retail|close ended|capital protection|\bweekly\b|\bdaily\b|fortnightly/i,

  /* category catalog: exposure = share of fund value in each bucket */
  CATS: [
    { key: 'largemid', label: 'Large & Mid Cap', re: /large\s*&\s*mid/i, q: ['Large & Mid', 'Large and Mid', 'Large & Midcap', 'Emerging Equities', 'Equity Opportunities', 'Core Equity'], tax: 'equity', exp: { eq: .97, debt: .03, mid: .42, small: .06 } },
    { key: 'large', label: 'Large Cap', re: /large cap fund/i, q: ['Large Cap', 'Bluechip', 'Top 100', 'Frontline'], tax: 'equity', exp: { eq: .97, debt: .03, mid: .06 } },
    { key: 'mid', label: 'Mid Cap', re: /mid cap fund/i, q: ['Mid Cap', 'Midcap'], tax: 'equity', exp: { eq: .97, debt: .03, mid: .68, small: .14 } },
    { key: 'small', label: 'Small Cap', re: /small cap fund/i, q: ['Small Cap', 'Smallcap'], tax: 'equity', exp: { eq: .95, debt: .05, small: .75, mid: .14 } },

    { key: 'elss', label: 'ELSS (Tax Saver)', re: /elss/i, q: ['ELSS', 'Tax Saver', 'Tax Saving', 'Taxsaver', 'Long Term Equity'], tax: 'equity', elss: true, exp: { eq: .97, debt: .03, mid: .2, small: .1 } },

    { key: 'aggr', label: 'Aggressive Hybrid', re: /aggressive hybrid/i, q: ['Equity & Debt', 'Equity Hybrid', 'Hybrid Equity', 'Aggressive Hybrid', 'Equity and Debt', 'Balanced Fund'], tax: 'equity', exp: { eq: .75, debt: .25, mid: .1, small: .04 } },
    { key: 'baf', label: 'Balanced Advantage', re: /dynamic asset allocation|balanced advantage/i, q: ['Balanced Advantage', 'Dynamic Asset Allocation', 'Dynamic Equity', 'Asset Allocator'], tax: 'equity', exp: { eq: .55, debt: .45, mid: .05 } },
    { key: 'multiasset', label: 'Multi Asset', re: /multi asset/i, q: ['Multi Asset'], tax: 'other', exp: { eq: .55, debt: .25, gold: .2, mid: .05 } },
    { key: 'eqsav', label: 'Equity Savings', re: /equity savings/i, q: [], tax: 'equity', exp: { eq: .35, debt: .65 } },
