/* ---------- Import / Export ---------- */
const IMP = {
  template: 'client_name,phone,scheme_code,scheme_name,folio,sip_amount,sip_day,sip_start,step_up,lumpsum_date,lumpsum_amount,units,invested\nRahul Mehta,9876543210,122640,,1234567,10000,5,2021-03-05,10,,,,\nRahul Mehta,9876543210,,HDFC Flexi Cap,7654321,,,,,2022-06-15,200000,,\n',
  inputs() { return `<input type="file" id="fileJson" accept=".json,application/json" class="hide" onchange="IMP.json(this)"><input type="file" id="fileCsv" accept=".csv,text/csv" class="hide" onchange="IMP.csv(this)">`; },
  json(inp) {
    const f = inp.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const s = JSON.parse(r.result); if (!s.clients) throw new Error('Invalid backup'); V.confirm('Backup import karein?', `${s.clients.length} clients. Current data replace ho jayega.`, () => { App.state = { ...App.DEFAULTS(), ...s, settings: { ...App.DEFAULTS().settings, ...(s.settings || {}) } }; App.save(); App.refreshData(); U.toast('Imported ✓'); }); } catch (e) { U.toast('Import failed: ' + e.message); } inp.value = ''; };
    r.readAsText(f);
  },
  parseCsv(t) {
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < t.length; i++) { const ch = t[i]; if (q) { if (ch === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; } else if (ch === '"') q = true; else if (ch === ',') { row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += ch; }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    const h = (rows.shift() || []).map(x => x.trim().toLowerCase());
    return rows.filter(r => r.some(x => x.trim())).map(r => Object.fromEntries(h.map((k, i) => [k, (r[i] || '').trim()])));
  },
  async csv(inp) {
    const f = inp.files[0]; if (!f) return; const text = await f.text(); inp.value = '';
    const rows = IMP.parseCsv(text); if (!rows.length) return U.toast('CSV khali hai');
    U.toast(`${rows.length} rows import ho rahi hain…`, 5000);
    let ok = 0, bad = [];
    for (const r of rows) {
      const nm = r.client_name || r.client || r.name; if (!nm) { bad.push('no client'); continue; }
      let c = App.state.clients.find(x => x.name.toLowerCase() === nm.toLowerCase());
      if (!c) { c = { id: U.uid(), name: nm, phone: r.phone || '', holdings: [], goals: [], risk: {}, regime: 'new', slab: 30, createdAt: U.todayKey(), log: [] }; App.state.clients.push(c); }
      let code = r.scheme_code, name = r.scheme_name;
      if (!code && name) { try { const p = API.pickPlan(await API.search(name), App.state.settings.plan); if (p) { code = p.schemeCode; name = p.schemeName; } } catch (e) { } }
      if (!code) { bad.push(nm + ': ' + (name || '?')); continue; }
      const hd = { id: U.uid(), code: String(code), name: name || '', folio: r.folio || '', sip: { amount: U.num(r.sip_amount), day: +r.sip_day || '', start: r.sip_start || '', stepUp: U.num(r.step_up), active: true }, lumps: r.lumpsum_date && U.num(r.lumpsum_amount) ? [{ date: r.lumpsum_date, amount: U.num(r.lumpsum_amount) }] : [], reds: [], unitsOverride: U.num(r.units) || null, investedOverride: U.num(r.invested) || null };
      if (!hd.sip.amount && !hd.lumps.length) { bad.push(nm + ': no SIP/lumpsum'); continue; }
      c.holdings.push(hd); ok++;
    }
    App.save(); await App.refreshData();
    for (const c of App.state.clients) for (const h of c.holdings) if (!h.name) { const x = API.mem.get('hf:' + h.code); if (x) h.name = x.name; }
    App.save();
    V.modal('CSV import', `<p><b>${ok}</b> holdings import hue.</p>${bad.length ? `<p class="neg small">${bad.length} rows skip: ${bad.slice(0, 10).map(U.esc).join('; ')}</p>` : ''}`, `<button class="btn pri" data-act="closeModal">OK</button>`);
  }
};

/* ---------- Calculators ---------- */
const TOOLS = {
  bind() {
    const g = k => U.num((U.$(`[data-t=${k}]`) || {}).value);
    const run = () => {
      // step-up
      const sip = g('s_sip'), yrs = g('s_y'), r = g('s_r') / 100, s = g('s_s') / 100, n = Math.round(yrs * 12);
      const flat = P.fvSip(sip, r, n, 0), up = P.fvSip(sip, r, n, s);
      let inv = 0, a = sip; for (let k = 0; k < n; k++) { if (k && k % 12 === 0) a *= 1 + s; inv += a; }
      U.$('#s_out').innerHTML = `<div class="kv"><span>Flat SIP corpus</span><b>${U.inr(flat)}</b><span>Step-up corpus</span><b class="pos">${U.inr(up)}</b><span>Total invested (step-up)</span><b>${U.inr(inv)}</b><span>Extra wealth from step-up</span><b class="pos">${U.inr(up - flat)}</b><span>Last-year SIP</span><b>${U.inr(sip * Math.pow(1 + s, Math.max(0, Math.ceil(yrs) - 1)))}/mo</b></div>`;
      const L = [], A1 = [], B1 = []; for (let yy = 1; yy <= yrs; yy++) { L.push('Y' + yy); A1.push(Math.round(P.fvSip(sip, r, yy * 12, 0))); B1.push(Math.round(P.fvSip(sip, r, yy * 12, s))); }
      App.chart('tStep', { type: 'bar', data: { labels: L, datasets: [{ label: 'Flat', data: A1, backgroundColor: '#BAE6FD', borderRadius: 4 }, { label: 'Step-up', data: B1, backgroundColor: '#0284C7', borderRadius: 4 }] }, options: { plugins: { legend: { display: true, labels: { boxWidth: 10 } } }, scales: { y: { ticks: { callback: v => U.inrS(v) } }, x: { grid: { display: false } } } } });
      // goal
      const gt = g('g_t'), gy = g('g_y'), gi = g('g_i') / 100, gr = g('g_r') / 100, gc = g('g_c'), gs = g('g_s') / 100;
      const fut = gt * Math.pow(1 + gi, gy), fromC = gc * Math.pow(1 + gr, gy), need = Math.max(0, fut - fromC), unit = P.fvSip(1, gr, gy * 12, gs);
      U.$('#g_out').innerHTML = `<div class="kv"><span>Future target</span><b>${U.inr(fut)}</b><span>Corpus grows to</span><b>${U.inr(fromC)}</b><span>Required SIP${gs ? ' (start, ' + (gs * 100) + '% step-up)' : ''}</span><b class="pos">${U.inr(need / unit)}/mo</b><span>Lumpsum today instead</span><b>${U.inr(need / Math.pow(1 + gr, gy))}</b></div>`;
      // swp
      const wc = g('w_c'), ww = g('w_w'), wr = g('w_r') / 100, wi = g('w_i') / 100, mi = Math.pow(1 + wr, 1 / 12) - 1;
      let bal = wc, w = ww, mo = 0; const sb = [], sl = [];
      while (bal > 0 && mo < 600) { if (mo && mo % 12 === 0) w *= 1 + wi; bal = bal * (1 + mi) - w; mo++; if (mo % 12 === 0) { sl.push('Y' + mo / 12); sb.push(Math.max(0, Math.round(bal))); } }
      U.$('#w_out').innerHTML = `<div class="kv"><span>Withdrawal rate</span><b>${U.pct(ww * 12 / wc)}</b><span>Corpus lasts</span><b class="${mo >= 600 ? 'pos' : mo < 240 ? 'neg' : ''}">${mo >= 600 ? '50+ saal' : (mo / 12).toFixed(1) + ' saal'}</b><span>Sustainable (~6%)</span><b>${U.inr(wc * .06 / 12)}/mo</b></div>`;
      App.chart('tSwp', { type: 'line', data: { labels: sl.slice(0, 40), datasets: [{ data: sb.slice(0, 40), borderColor: '#0284C7', backgroundColor: 'rgba(14,165,233,.12)', fill: true, pointRadius: 0, tension: .2 }] }, options: { scales: { y: { ticks: { callback: v => U.inrS(v) } }, x: { grid: { display: false } } } } });
    };
    U.$$('[data-t]').forEach(i => i.oninput = U.debounce(run, 200)); run();
  }
};

/* ---------- Client report (print → PDF) ---------- */
V.report = function (c) {
  const { A, recs = [] } = App.analysis.get(c.id) || {}; if (!A) return;
  const s = App.state.settings, open = recs.filter(r => r.status === 'open' && !['birthday', 'review'].includes(r.type));
  const img = (cfg, w = 520, h = 260) => { cfg.options = cfg.options || {}; cfg.options.plugins = Object.assign({ legend: { display: true, position: 'right' }, tooltip: { enabled: false } }, cfg.options.plugins || {}); try { return SC.svg(cfg, w, h); } catch (e) { return ''; } };
  const cats = Object.entries(A.byCat).sort((a, b) => b[1] - a[1]);
  const pie = img({ type: 'doughnut', data: { labels: cats.map(x => `${x[0]} ${U.pct(x[1] / A.value, 0)}`), datasets: [{ data: cats.map(x => x[1]), backgroundColor: PALETTE }] }, options: { cutout: '58%' } }, 420, 220);
  const g = V.growth(A);
  const line = g ? img({ type: 'line', data: { labels: g.t.map(U.fmtMon), datasets: [{ label: 'Value', data: g.val, borderColor: '#0284C7', backgroundColor: 'rgba(14,165,233,.15)', fill: true, pointRadius: 0 }, { label: 'Invested', data: g.inv, borderColor: '#94A3B8', borderDash: [4, 3], pointRadius: 0 }] }, options: { plugins: { legend: { display: true } }, scales: { y: { ticks: { callback: v => U.inrS(v) } } } } }, 680, 220) : '';
  const prof = A.profile;
  const el = U.$('#print');
  el.innerHTML = `<div class="pr-h"><div class="logo">${U.esc((s.firm || 'S')[0])}</div><div style="flex:1"><div style="font-size:17px;font-weight:800">${U.esc(s.firm)}</div><div style="font-size:11px">${U.esc(s.advisor)} · Mutual Fund Distributor · ${U.esc(s.arn)} · ${U.esc(s.phone)}${s.email ? ' · ' + U.esc(s.email) : ''} · ${U.esc(s.city)}</div></div><div style="text-align:right"><div style="font-size:15px;font-weight:800">Portfolio Review</div><div style="font-size:11px">${U.fmtDate(U.today())}</div></div></div>
    <div class="pr-sec"><h2>${U.esc(c.name)} — ${prof.name} investor</h2><div class="pr-k"><div>Current value<b>${U.inr(A.value)}</b></div><div>Invested<b>${U.inr(A.invested)}</b></div><div>Gain<b>${U.inr(A.gain)} (${U.pctS(A.abs)})</b></div><div>XIRR<b>${U.pct(A.xirr)}</b></div><div>Monthly SIP<b>${U.inr(A.sip)}</b></div></div></div>
    <div class="pr-sec" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><h2>Category mix</h2>${pie}</div><div><h2>Allocation vs target (${prof.name})</h2><table><tr><th>Asset</th><th>Actual</th><th>Target</th></tr><tr><td>Equity</td><td>${U.pct(A.exp.eq)}</td><td>${U.pct(prof.eq, 0)}</td></tr><tr><td>Debt</td><td>${U.pct(A.exp.debt)}</td><td>${U.pct(1 - prof.eq - prof.gold, 0)}</td></tr><tr><td>Gold</td><td>${U.pct(A.exp.gold)}</td><td>${U.pct(prof.gold, 0)}</td></tr><tr><td>Small + Mid cap</td><td>${U.pct(A.smid)}</td><td>max ${U.pct(prof.smid, 0)}</td></tr></table></div></div>
    ${line ? `<div class="pr-sec"><h2>Portfolio growth</h2>${line}</div>` : ''}
    <div class="pr-sec"><h2>Holdings (NAV ${A.hs[0] && A.hs[0].navT ? U.fmtDate(A.hs[0].navT) : ''})</h2><table><tr><th>Fund</th><th>Category</th><th>SIP</th><th>Invested</th><th>Value</th><th>Gain</th><th>XIRR</th><th>Peer rank</th></tr>${A.hs.filter(x => x.h).map(x => `<tr><td>${U.esc(R.short(x.name))}</td><td>${x.cat.label}</td><td>${x.sipNow ? U.inr(x.sipNow) : '—'}</td><td>${U.inr(x.invested)}</td><td>${U.inr(x.value)}</td><td>${U.inr(x.gain)}</td><td>${U.pct(x.xirr)}</td><td>${x.st ? '#' + x.st.rank + '/' + x.st.of : '—'}</td></tr>`).join('')}</table></div>
    ${(c.goals || []).length ? `<div class="pr-sec"><h2>Goals</h2><table><tr><th>Goal</th><th>Year</th><th>Future target</th><th>Projected</th><th>On track</th><th>Extra SIP needed</th></tr>${c.goals.map(gg => { const p = P.goalPlan(gg, A); return `<tr><td>${U.esc(gg.name)}</td><td>${gg.year}</td><td>${U.inr(p.future)}</td><td>${U.inr(p.proj)}</td><td>${Math.round(p.done * 100)}%</td><td>${p.gap > 0 ? U.inr(p.extraSip) + '/mo' : '—'}</td></tr>`; }).join('')}</table></div>` : ''}
    <div class="pr-sec"><h2>Recommendations</h2>${open.length ? open.map(r => `<div class="pr-rec" style="border-left-color:${r.t.color}"><b>${U.esc(r.title)}</b> <span style="color:#64748B">· ${r.t.label} · ${R.PRI[r.pri]}</span><div>${U.esc(r.why)}</div><ol style="margin:4px 0 2px 16px;padding:0">${r.steps.map(x => `<li>${U.esc(x)}</li>`).join('')}</ol>${r.reasons.length ? `<div style="color:#475569"><i>Why:</i> ${r.reasons.map(U.esc).join(' ')}</div>` : ''}</div>`).join('') : '<p>Portfolio on track — koi badlaav zaroori nahi.</p>'}</div>
    <div class="pr-disc">Mutual Fund investments are subject to market risks, read all scheme related documents carefully. Past performance may or may not be sustained in future. Returns and peer rankings are computed from AMFI NAV data; tax estimates use FY 2026-27 rules and are indicative — please consult your tax advisor. Prepared by ${U.esc(s.advisor)} (${U.esc(s.arn)}), AMFI-registered Mutual Fund Distributor.</div>`;
  App.log(c, '🖨 Review report generated'); App.save();
  setTimeout(() => { try { window.print(); } catch (e) { U.toast('Print blocked — browser menu se Print → Save as PDF'); } }, 300);
};
</script>

</script>
