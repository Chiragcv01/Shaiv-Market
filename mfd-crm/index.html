    { key: 'shortdur', label: 'Short Duration', re: /short duration/i, q: ['Short Duration', 'Short Term Fund', 'Short Term Debt'], tax: 'debt', exp: { debt: 1 } },
    { key: 'corpbond', label: 'Corporate Bond', re: /corporate bond/i, q: ['Corporate Bond'], tax: 'debt', exp: { debt: 1 } },
    { key: 'debt', label: 'Other Debt', re: /debt scheme/i, q: [], tax: 'debt', exp: { debt: 1 } },
    { key: 'idx50', label: 'Nifty 50 Index', re: null, q: ['Nifty 50 Index'], tax: 'equity', exp: { eq: 1 } },
    { key: 'idxmid', label: 'Midcap Index', re: null, q: [], tax: 'equity', exp: { eq: 1, mid: .9, small: .1 } },
    { key: 'idxsmall', label: 'Smallcap Index', re: null, q: [], tax: 'equity', exp: { eq: 1, small: .9 } },
    { key: 'idxeq', label: 'Equity Index / ETF', re: null, q: [], tax: 'equity', exp: { eq: 1, mid: .1 } },
    { key: 'idxdebt', label: 'Debt Index', re: null, q: [], tax: 'debt', exp: { debt: 1 } },
    { key: 'gold', label: 'Gold / Silver', re: null, q: ['Gold Fund', 'Gold Savings', 'Gold ETF Fund of Fund'], tax: 'other', exp: { gold: 1 } },
    { key: 'intl', label: 'International', re: /overseas/i, q: [], tax: 'other', exp: { intl: 1 } },
    { key: 'solution', label: 'Retirement / Children', re: /solution oriented|retirement|children/i, q: [], tax: 'equity', exp: { eq: .7, debt: .3, mid: .1 } },
    { key: 'other', label: 'Other', re: null, q: [], tax: 'other', exp: { eq: .5, debt: .5 } }
  ],
  SCREEN: ['flexi', 'large', 'largemid', 'mid', 'small', 'multi', 'focused', 'value', 'contra', 'elss', 'aggr', 'baf', 'multiasset', 'arbitrage', 'liquid', 'shortdur', 'corpbond', 'idx50', 'gold'],
  cat(key) { return M.CATS.find(c => c.key === key) || M.CATS[M.CATS.length - 1]; },

  catOf(metaCat = '', name = '') {
    const mc = String(metaCat), n = String(name);
    if (/index fund|etf/i.test(mc) || /\bindex\b|\betf\b/i.test(n) && /other scheme/i.test(mc)) {
      if (/gold|silver/i.test(n)) return 'gold';
      if (/gilt|g-sec|gsec|sdl|bond|crisil|psu|debt|liquid|t-bill|money market/i.test(n)) return 'idxdebt';
      if (/nasdaq|s&p|\bus\b|global|international|hang seng|nyse|msci|world|fang/i.test(n)) return 'intl';
      if (/small\s*cap|smallcap/i.test(n)) return 'idxsmall';
      if (/mid\s*cap|midcap/i.test(n)) return 'idxmid';
      if (/nifty\s*50\b(?!\s*(equal|value|alpha|low|quality|momentum|arbitrage))/i.test(n) && !/next/i.test(n)) return 'idx50';
      return 'idxeq';
    }
    if (/fof|fund of fund/i.test(mc)) {
      if (/gold|silver/i.test(n)) return 'gold';
      if (/overseas/i.test(mc) || /nasdaq|global|international|us |world/i.test(n)) return 'intl';
      if (/multi asset/i.test(n)) return 'multiasset';
      return 'other';
    }
    if (/gold|silver/i.test(mc)) return 'gold';
    for (const c of M.CATS) if (c.re && c.re.test(mc)) return c.key;
    if (/equity scheme/i.test(mc)) return 'flexi';
    if (/hybrid/i.test(mc)) return 'aggr';
    return 'other';
  },

  /* ---- series helpers ---- */
  iBefore(h, t) { let lo = 0, hi = h.t.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (h.t[m] <= t) { r = m; lo = m + 1; } else hi = m - 1; } return r; },
  iAfter(h, t) { let lo = 0, hi = h.t.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (h.t[m] >= t) { r = m; hi = m - 1; } else lo = m + 1; } return r; },
  navOn(h, t) { const i = M.iBefore(h, t); return i < 0 ? null : h.v[i]; },
  retBetween(h, t0, t1) {
    const i0 = M.iBefore(h, t0), i1 = M.iBefore(h, t1);
    if (i0 < 0 || i1 < 0 || h.t[0] > t0 + 10 * DAY) return null;
    const yrs = (h.t[i1] - h.t[i0]) / YEAR, r = h.v[i1] / h.v[i0];
    return yrs >= 0.99 ? Math.pow(r, 1 / yrs) - 1 : r - 1;
  },
  ret(h, days) { if (!h || !h.t.length) return null; return M.retBetween(h, h.lastT - days * DAY, h.lastT); },
  dailyRets(h, fromT) {
    const out = []; let i = Math.max(1, M.iAfter(h, fromT));
    if (i < 1) return out;
    for (; i < h.t.length; i++) out.push(Math.log(h.v[i] / h.v[i - 1]));
    return out;
  },
  vol(h, years = 3) {
    const r = M.dailyRets(h, h.lastT - years * YEAR); if (r.length < 120) return null;
    const m = r.reduce((a, b) => a + b, 0) / r.length;
    return Math.sqrt(r.reduce((a, b) => a + (b - m) ** 2, 0) / (r.length - 1)) * Math.sqrt(250);
  },
  downDev(h, years = 3) {
    const r = M.dailyRets(h, h.lastT - years * YEAR); if (r.length < 120) return null;
    return Math.sqrt(r.reduce((a, b) => a + Math.min(0, b) ** 2, 0) / r.length) * Math.sqrt(250);
  },
  maxDD(h, years = 3) {
    let i = Math.max(0, M.iAfter(h, h.lastT - years * YEAR)); if (i < 0) return null;
    let peak = h.v[i], dd = 0;
    for (; i < h.v.length; i++) { if (h.v[i] > peak) peak = h.v[i]; dd = Math.min(dd, h.v[i] / peak - 1); }
    return dd;
  },
  fromHigh(h, days = 365) {
    let i = Math.max(0, M.iAfter(h, h.lastT - days * DAY)), peak = 0, pT = 0;
    for (; i < h.v.length; i++) if (h.v[i] >= peak) { peak = h.v[i]; pT = h.t[i]; }
    return { dd: h.lastV / peak - 1, peak, peakT: pT };
  },
  rolling(h, win = 3, months = 24) {
    const vals = [];
    for (let k = 0; k < months; k++) {
      const end = h.lastT - k * 30.44 * DAY, start = end - win * YEAR;
      if (start < h.t[0] - 5 * DAY) break;
      const r = M.retBetween(h, start, end); if (r != null) vals.push(r);
    }
    if (vals.length < 6) return null;
    return { win, n: vals.length, avg: vals.reduce((a, b) => a + b, 0) / vals.length, min: Math.min(...vals), max: Math.max(...vals), vals };
  },
  compute(h, rf = 0.065) {
    if (!h || h.t.length < 30) return null;
    const ageY = (h.lastT - h.t[0]) / YEAR;
    const m = {
      lastV: h.lastV, lastT: h.lastT, ageY,
      r1m: M.ret(h, 30), r3m: M.ret(h, 91), r6m: M.ret(h, 182),
      r1: M.ret(h, 365), r3: M.ret(h, 3 * 365), r5: M.ret(h, 5 * 365),
      vol: M.vol(h, 3) ?? M.vol(h, 1), dd: M.maxDD(h, 3), hi: M.fromHigh(h).dd
    };
    m.roll = M.rolling(h, 3, 24) || M.rolling(h, 1, 24);
    const base = m.r3 ?? m.r1;
    m.sharpe = (base != null && m.vol) ? (base - rf) / m.vol : null;
    const dd = M.downDev(h, 3) ?? M.downDev(h, 1);
    m.sortino = (base != null && dd) ? (base - rf) / dd : null;
    return m;
  },
  /* composite percentile score of m vs peer metrics list */
  W: { r1: .15, r3: .25, r5: .15, roll: .15, rollMin: .1, sharpe: .1, dd: .1 },
  score(m, peers) {
    if (!m || m.r3 == null) return null;
    const col = f => peers.map(f);
    const p = {
      r1: U.pr(col(x => x.r1), m.r1), r3: U.pr(col(x => x.r3), m.r3),
      r5: m.r5 != null ? U.pr(col(x => x.r5), m.r5) : null,
      roll: m.roll && m.roll.win === 3 ? U.pr(col(x => x.roll && x.roll.win === 3 ? x.roll.avg : null), m.roll.avg) : null,
      rollMin: m.roll && m.roll.win === 3 ? U.pr(col(x => x.roll && x.roll.win === 3 ? x.roll.min : null), m.roll.min) : null,
      sharpe: U.pr(col(x => x.sharpe), m.sharpe), dd: U.pr(col(x => x.dd), m.dd)
    };
    let s = 0, w = 0;
    for (const k in M.W) if (p[k] != null) { s += p[k] * M.W[k]; w += M.W[k]; }
    return w ? { score: s / w, p } : null;
  },

  /* ---- Peer leaderboard for a category ---- */
  lbMem: {},
  lbKey: (key, plan) => `lb3:${key}:${plan}`,
  lbCached(key, plan) {
    const k = M.lbKey(key, plan);
    if (M.lbMem[k]) return M.lbMem[k];
    const c = U.ls.get(k); if (c && c.n > 0 && (U.today() - U.parseISO(c.day)) <= 3 * DAY) { M.lbMem[k] = c; return c; }
    return null;
  },
  async leaderboard(key, plan = 'regular', onProg = () => { }, force = false) {
    if (!force) { const c = M.lbCached(key, plan); if (c) return c; }
    const cat = M.cat(key);
    onProg(`Searching ${cat.label} funds…`, 0);
    const seen = new Map();
    for (const q of cat.q) {
      try { (await API.search(q)).forEach(s => seen.set(s.schemeCode, s.schemeName)); } catch (e) { }
    }
    let cands = [...seen].map(([code, name]) => ({ code, name }))
      .filter(s => /growth/i.test(s.name) && !M.BAD_NAME.test(s.name) && (plan === 'direct' ? /direct/i.test(s.name) : !/direct/i.test(s.name)));
    // one per fund name
    const byFund = new Map();
    cands.forEach(s => { const f = s.name.split(/\s+-\s+/)[0].toLowerCase().replace(/\s+/g, ' '); if (!byFund.has(f) || /regular/i.test(s.name)) byFund.set(f, s); });
    const noIdx = !['idx50', 'gold'].includes(key);
    cands = [...byFund.values()].filter(s => noIdx ? !/\bindex\b|\betf\b|\bfof\b|fund of fund/i.test(s.name) : key !== 'idx50' || (/nifty\s*50/i.test(s.name) && !/next|value|alpha|low vol|quality|momentum|equal|arbitrage/i.test(s.name)))
      .sort((a, b) => (/regular|direct/i.test(b.name) ? 1 : 0) - (/regular|direct/i.test(a.name) ? 1 : 0) || b.code - a.code).slice(0, 70);
    if (!cands.length) throw new Error(`${cat.label}: scheme list se koi fund nahi mila${API.listErr ? ' (' + API.listErr + ')' : ''}`);
    let fails = 0;
    const out = []; let done = 0;
    await Promise.all(cands.map(async s => {
      try {
        const h = await API.history(s.code, '6y');
        const ck = M.catOf(h.cat, h.name || s.name);
        if (ck === key && U.today() - h.lastT < 20 * DAY) {
          const m = M.compute(h, (App.state.settings.rf || 6.5) / 100);
          if (m) out.push({ code: String(s.code), name: h.name || s.name, amc: h.amc, m });
        }
      } catch (e) { fails++; }
      done++; onProg(`Analysing ${cat.label}: ${done}/${cands.length}`, done / cands.length);
    }));
    if (!out.length) throw new Error(`${cat.label}: ${fails ? fails + ' NAV fetch fail hue' : 'koi active fund nahi mila'} — internet check karke dobara try karo`);
    const ms = out.map(f => f.m);
    out.forEach(f => { const s = M.score(f.m, ms); f.score = s ? s.score : null; f.p = s ? s.p : null; });
    out.sort((a, b) => (b.score ?? -1) - (a.score ?? -1) || (b.m.r1 ?? -9) - (a.m.r1 ?? -9));
    out.forEach((f, i) => f.rank = i + 1);
    const lb = {
      key, plan, day: U.todayKey(), n: out.length,
      med: { r1: U.median(ms.map(x => x.r1)), r3: U.median(ms.map(x => x.r3)), r5: U.median(ms.map(x => x.r5)), vol: U.median(ms.map(x => x.vol)), dd: U.median(ms.map(x => x.dd)) },
      funds: out.map(f => ({ code: f.code, name: f.name, amc: f.amc, score: f.score, rank: f.rank, m: { ...f.m, roll: f.m.roll ? { win: f.m.roll.win, avg: f.m.roll.avg, min: f.m.roll.min, n: f.m.roll.n } : null } }))
    };
    const k = M.lbKey(key, plan);
    M.lbMem[k] = lb; U.ls.set(k, lb);
    onProg('Done', 1);
    return lb;
  },
  /* where does metrics m stand inside leaderboard lb */
  standing(m, lb, code) {
    if (!m || !lb || !lb.funds.length) return null;
    const own = lb.funds.find(f => f.code === String(code));
    if (own && own.score != null) return { score: own.score, p: null, rank: own.rank, of: lb.funds.filter(f => f.score != null).length, inList: true };
    const peers = lb.funds.map(f => f.m);
    const s = M.score(m, peers);
    if (!s) return null;
    const ranked = lb.funds.filter(f => f.score != null).length;
    const better = lb.funds.filter(f => f.score != null && f.score > s.score).length;
    return { score: s.score, p: s.p, rank: better + 1, of: ranked + 1 };
  }
};

/* --- portfolio.js --- */
/* ===== Risk profiling, holdings, tax buckets, goals ===== */
const P = {
  RISK_Q: [
    { id: 'age', q: 'Client ki age?', o: [['30 se kam', 5], ['30–40', 4], ['40–50', 3], ['50–60', 2], ['60+', 1]] },
    { id: 'horizon', q: 'Paisa kitne saal tak invested reh sakta hai?', o: [['10+ saal', 5], ['7–10 saal', 4], ['5–7 saal', 3], ['3–5 saal', 2], ['3 saal se kam', 1]] },
    { id: 'income', q: 'Income kitni stable hai?', o: [['Bahut stable + badh rahi', 5], ['Stable', 4], ['Thodi variable', 3], ['Uncertain', 2], ['Retired / fixed', 1]] },
    { id: 'deps', q: 'Financial dependents / EMIs?', o: [['Koi nahi', 5], ['1 dependent', 4], ['2–3 dependents', 3], ['Dependents + bada EMI', 2], ['Pura parivar depend', 1]] },
    { id: 'ef', q: 'Emergency fund (6 mahine kharcha) hai?', o: [['12+ mahine', 5], ['6–12 mahine', 4], ['3–6 mahine', 3], ['1–3 mahine', 2], ['Nahi hai', 1]] },
    { id: 'exp', q: 'Investing ka experience?', o: [['Equity/MF 7+ saal', 5], ['3–7 saal', 4], ['1–3 saal', 3], ['Sirf FD/RD/LIC', 2], ['Bilkul naya', 1]] },
    { id: 'fall', q: 'Market 25% gire to client kya karega?', o: [['Aur invest karega', 5], ['Hold karega', 4], ['Tension, par hold', 3], ['Kuch bech dega', 2], ['Sab bech dega', 1]] },
    { id: 'goal', q: 'Main objective?', o: [['Maximum growth', 5], ['Growth + thoda safety', 4], ['Balanced', 3], ['Regular income', 2], ['Capital safety', 1]] }
  ],
  PROFILES: [
    { key: 'C', name: 'Conservative', max: 14, eq: .20, gold: .05, smid: .05, ret: .085, color: '#0369A1' },
    { key: 'MC', name: 'Mod. Conservative', max: 20, eq: .40, gold: .07, smid: .10, ret: .095, color: '#0284C7' },
    { key: 'M', name: 'Moderate', max: 27, eq: .60, gold: .08, smid: .20, ret: .105, color: '#0EA5E9' },
    { key: 'MA', name: 'Mod. Aggressive', max: 33, eq: .75, gold: .07, smid: .30, ret: .115, color: '#38BDF8' },
    { key: 'A', name: 'Aggressive', max: 40, eq: .85, gold: .05, smid: .40, ret: .12, color: '#7DD3FC' }
  ],
  profileOf(c) {
    if (c.riskOverride) return P.PROFILES.find(p => p.key === c.riskOverride) || P.PROFILES[2];
    const s = P.riskScore(c); if (s == null) return P.PROFILES[2];
    return P.PROFILES.find(p => s <= p.max) || P.PROFILES[4];
  },
  riskScore(c) {
    const a = c.risk || {}; const vals = P.RISK_Q.map(q => a[q.id]).filter(v => v);
    if (vals.length < 4) return null;
    return Math.round(vals.reduce((x, y) => x + y, 0) * 8 / vals.length);
  },

  /* lots from SIP schedule + lumpsums, priced on actual historical NAV */
  lots(hd, h) {
    const lots = []; if (!h || !h.t.length) return lots;
    const today = U.today(), lastT = h.lastT;
    const sip = hd.sip || {};
    if (sip.amount > 0 && sip.start) {
      const s = U.parseISO(sip.start); const sd = new Date(s);
      const day = +sip.day || sd.getUTCDate();
      const endT = sip.active === false && sip.end ? U.parseISO(sip.end) : today;
      const nowYrs = Math.floor((Math.min(endT, today) - s) / (365.25 * DAY));
      let y = sd.getUTCFullYear(), m = sd.getUTCMonth(), k = 0;
      while (k++ < 720) {
        const t = Date.UTC(y, m, Math.min(day, U.dim(y, m)));
        m++; if (m > 11) { m = 0; y++; }
        if (t < s) continue;
        if (t > endT || t > lastT) break;
        const yrs = Math.floor((t - s) / (365.25 * DAY));
        const amt = sip.amount * Math.pow(1 + (+sip.stepUp || 0) / 100, yrs - nowYrs);
        const i = M.iAfter(h, t); if (i < 0) break;
        lots.push({ t, nt: h.t[i], amt, nav: h.v[i], units: amt / h.v[i], kind: 'SIP' });
      }
    }
    (hd.lumps || []).forEach(l => {
      const t = U.parseISO(l.date), amt = U.num(l.amount); if (!t || !(amt > 0)) return;
      const i = M.iAfter(h, t); if (i < 0) return;
      lots.push({ t, nt: h.t[i], amt, nav: h.v[i], units: amt / h.v[i], kind: 'Lumpsum' });
    });
    lots.sort((a, b) => a.t - b.t);
    // redemptions / switch-outs, FIFO
    (hd.reds || []).slice().sort((a, b) => U.parseISO(a.date) - U.parseISO(b.date)).forEach(r => {
      let u = U.num(r.units); const rt = U.parseISO(r.date);
      if (!(u > 0) && U.num(r.amount) > 0) { const nv = M.navOn(h, rt); if (nv) u = U.num(r.amount) / nv; }
      for (const l of lots) { if (u <= 1e-9) break; if (l.t > rt || l.units <= 0) continue; const take = Math.min(l.units, u); l.amt *= (l.units - take) / l.units; l.units -= take; u -= take; }
    });
    const live = lots.filter(l => l.units > 1e-6);
    const U0 = live.reduce((a, l) => a + l.units, 0);
    if (hd.unitsOverride > 0 && U0 > 0) { const f = hd.unitsOverride / U0; live.forEach(l => l.units *= f); }
    const A0 = live.reduce((a, l) => a + l.amt, 0);
    if (hd.investedOverride > 0 && A0 > 0) { const f = hd.investedOverride / A0; live.forEach(l => l.amt *= f); }
    return live;
  },

  /* tax rules (FY 2026-27, unchanged by Budget 2026): equity STCG 20% (<=12m), LTCG 12.5% above ₹1.25L;
     debt bought on/after 1-Apr-2023: slab; gold/intl/other FoF: >24m 12.5%, else slab */
  lotTax(l, taxCls, today, slab) {
    const age = today - l.t; const res = { lt: false, rate: slab, lockUntil: null, ltOn: null };
    if (taxCls === 'equity') { res.lt = age > YEAR; res.rate = res.lt ? .125 : .20; res.ltOn = l.t + YEAR + DAY; }
    else if (taxCls === 'debt') { if (l.t < Date.UTC(2023, 3, 1)) { res.lt = age > 2 * YEAR; res.rate = res.lt ? .125 : slab; res.ltOn = l.t + 2 * YEAR + DAY; } else { res.lt = false; res.rate = slab; } }
    else { res.lt = age > 2 * YEAR; res.rate = res.lt ? .125 : slab; res.ltOn = l.t + 2 * YEAR + DAY; }
    return res;
  },

  holding(hd, h, client, ctx) {
    const today = U.today(), slab = (client.slab ?? 30) / 100;
    const catKey = h ? M.catOf(h.cat, h.name || hd.name) : (hd.catKey || 'other');
    const cat = M.cat(catKey);
    const lots = P.lots(hd, h);
    const units = lots.reduce((a, l) => a + l.units, 0);
    const invested = lots.reduce((a, l) => a + l.amt, 0);
    const nav = h ? h.lastV : 0, value = units * nav, gain = value - invested;
    const flows = lots.map(l => ({ t: l.t, v: -l.amt })); if (value > 0) flows.push({ t: h.lastT, v: value });
    const xirr = lots.length && value > 0 ? U.xirr(flows) : null;
    const tx = { ltGain: 0, ltValue: 0, stGain: 0, stValue: 0, lockedValue: 0, exitLoadValue: 0, lossValue: 0, loss: 0, nextLt: null, allLt: null, lockFree: null };
    lots.forEach(l => {
      const v = l.units * nav, g = v - l.amt, r = P.lotTax(l, cat.tax, today, slab);
      l.value = v; l.gain = g; l.lt = r.lt; l.rate = r.rate;
      if (cat.elss && today - l.t < 3 * YEAR) { tx.lockedValue += v; l.locked = l.t + 3 * YEAR; tx.lockFree = tx.lockFree ? Math.min(tx.lockFree, l.locked) : l.locked; }
      if (r.lt) { tx.ltGain += g; tx.ltValue += v; } else { tx.stGain += g; tx.stValue += v; if (r.ltOn) { tx.nextLt = tx.nextLt ? Math.min(tx.nextLt, r.ltOn) : r.ltOn; tx.allLt = Math.max(tx.allLt || 0, r.ltOn); } }
      if (cat.tax === 'equity' && !cat.elss && catKey !== 'arbitrage' && today - l.t < YEAR) tx.exitLoadValue += v;
      if (g < 0) { tx.loss += g; tx.lossValue += v; }
    });
    const m = h ? M.compute(h, (App.state.settings.rf || 6.5) / 100) : null;
    const lb = ctx && ctx.lbs ? M.lbCached(catKey, App.state.settings.plan || 'regular') : null;
    const st = m && lb ? M.standing(m, lb, hd.code) : null;
    const sipNow = hd.sip && hd.sip.amount > 0 && hd.sip.active !== false ? +hd.sip.amount : 0;
    return { hd, h, name: h ? h.name : hd.name, amc: h ? h.amc : '', catKey, cat, lots, units, invested, nav, navT: h ? h.lastT : null, value, gain, abs: invested ? gain / invested : null, xirr, tx, m, lb, st, sipNow, stale: h && h.stale };
  },

  analyze(client, ctx = {}) {
    const hs = client.holdings.map(hd => {
      const h = API.mem.get('hf:' + hd.code) || null;
      try { return P.holding(hd, h, client, ctx); } catch (e) { console.error(e); return P.holding(hd, null, client, ctx); }
    });
    const A = { client, hs, value: 0, invested: 0, gain: 0, sip: 0, exp: { eq: 0, debt: 0, gold: 0, intl: 0, mid: 0, small: 0, them: 0 }, byCat: {}, byAmc: {}, missing: 0 };
    const flows = [];
    hs.forEach(x => {
      if (!x.h) { A.missing++; return; }
      A.value += x.value; A.invested += x.invested; A.sip += x.sipNow;
      x.lots.forEach(l => flows.push({ t: l.t, v: -l.amt }));
      const e = x.cat.exp; for (const k in A.exp) A.exp[k] += (e[k] || 0) * x.value;
      A.byCat[x.cat.label] = (A.byCat[x.cat.label] || 0) + x.value;
      if (x.amc) A.byAmc[x.amc] = (A.byAmc[x.amc] || 0) + x.value;
    });
    A.gain = A.value - A.invested;
    A.abs = A.invested ? A.gain / A.invested : null;
    if (A.value > 0) { flows.push({ t: U.today(), v: A.value }); A.xirr = U.xirr(flows); for (const k in A.exp) A.exp[k] /= A.value; }
    A.profile = P.profileOf(client);
    A.age = U.age(client.dob);
    A.smid = A.exp.mid + A.exp.small;
    return A;
  },

  /* ---- goal maths ---- */
  fvSip(sip, rAnnual, months, stepUp = 0) {
    const i = Math.pow(1 + rAnnual, 1 / 12) - 1; let fv = 0, amt = sip;
    for (let k = 0; k < months; k++) { if (k && k % 12 === 0) amt *= 1 + stepUp; fv = (fv + amt) * (1 + i); }
    return fv;
  },
  goalPlan(g, A) {
    const now = U.today(); const yrs = Math.max(0.25, (Date.UTC(+g.year, 3, 1) - now) / YEAR);
    const infl = (g.inflation ?? 6) / 100;
    const future = U.num(g.target) * Math.pow(1 + infl, yrs);
    const linked = A.hs.filter(x => (g.links || []).includes(x.hd.id));
    const corpus = linked.length ? linked.reduce((a, x) => a + x.value, 0) : U.num(g.corpus);
    const sip = linked.length ? linked.reduce((a, x) => a + x.sipNow, 0) : U.num(g.sip);
    let r = A.profile.ret; if (yrs < 3) r = .07; else if (yrs < 5) r = Math.min(r, .09);
    const months = Math.round(yrs * 12);
    const proj = corpus * Math.pow(1 + r, yrs) + P.fvSip(sip, r, months, 0);
    const gap = future - proj;
    const unit = P.fvSip(1, r, months, 0);
    const extraSip = gap > 0 ? gap / unit : 0;
    // step-up % needed with current sip
    let stepNeed = null;
    if (gap > 0 && sip > 0) {
      let lo = 0, hi = .6;
      if (corpus * Math.pow(1 + r, yrs) + P.fvSip(sip, r, months, hi) >= future) {
        for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; (corpus * Math.pow(1 + r, yrs) + P.fvSip(sip, r, months, mid) >= future) ? hi = mid : lo = mid; }
        stepNeed = hi;
      }
    }
    const projStep10 = corpus * Math.pow(1 + r, yrs) + P.fvSip(sip, r, months, .10);
    return { yrs, future, corpus, sip, r, months, proj, gap, extraSip, stepNeed, projStep10, done: Math.min(1, proj / future), linked };
  }
};

/* --- engine.js --- */
/* ===== Recommendation engine: every suggestion carries numbers + reasoning ===== */
const R = {
  TYPES: {
    switch: { label: 'Switch', icon: 'swap', color: '#E11D48' },
    watch: { label: 'Watchlist', icon: 'eye', color: '#64748B' },
    harvest: { label: 'Tax harvest', icon: 'leaf', color: '#16A34A' },
    loss: { label: 'Loss harvest', icon: 'leaf', color: '#16A34A' },
    rebalance: { label: 'Rebalance', icon: 'scale', color: '#7C3AED' },
    risk: { label: 'Risk fit', icon: 'shield', color: '#EA580C' },
    consolidate: { label: 'Consolidate', icon: 'layers', color: '#64748B' },
    goal: { label: 'Goal gap', icon: 'target', color: '#0284C7' },
    stepup: { label: 'SIP step-up', icon: 'trend', color: '#0EA5E9' },
    upsell: { label: 'SIP increase', icon: 'plus', color: '#0EA5E9' },
    elss: { label: 'ELSS / 80C', icon: 'receipt', color: '#16A34A' },
    emergency: { label: 'Emergency fund', icon: 'life', color: '#EA580C' },
    stp: { label: 'STP', icon: 'flow', color: '#0284C7' },
    swp: { label: 'SWP', icon: 'cash', color: '#0284C7' },
    market: { label: 'Market move', icon: 'pulse', color: '#E11D48' },
    review: { label: 'Review due', icon: 'cal', color: '#64748B' },
    birthday: { label: 'Birthday', icon: 'gift', color: '#DB2777' }
  },
  PRI: { 3: 'High', 2: 'Medium', 1: 'Low' },
  plan() { return App.state.settings.plan || 'regular'; },
  best(catKey, excludeCode) {
    const lb = M.lbCached(catKey, R.plan()); if (!lb) return null;
    return lb.funds.find(f => f.code !== String(excludeCode) && f.score != null && f.m.ageY >= 3) || null;
  },
  short: n => String(n || '').replace(/\s*-\s*(regular|direct)\s*plan.*$/i, '').replace(/\s*-\s*growth.*$/i, '').replace(/\s+fund$/i, ' Fund').trim(),
  sig() { const s = App.state.settings; return `\n\n– ${s.advisor || 'Your MFD'}${s.arn ? ', ' + s.arn : ''}${s.firm ? ' (' + s.firm + ')' : ''}\nMF investments market risk ke adheen hain, scheme documents dhyan se padhein.`; },

  forClient(c, A) {
    const out = [], today = U.today(), mon = new Date(today).getUTCMonth();
    const fyEnd = U.fyEnd(), fyQ4 = mon <= 2;
    const fname = (c.name || '').split(' ')[0];
    const room = Math.max(0, 125000 - U.num(c.ltcgBooked));
    const slab = (c.slab ?? 30) / 100;
    const prof = A.profile;
    const mk = App.market;
    const add = r => { r.client = c; r.cid = c.id; out.push(r); };

    /* 1. SWITCH / WATCH — peer-relative underperformance */
    A.hs.forEach(x => {
      if (!x.h || !x.m || !x.st || !x.lb || x.value < 1000) return;
      const lb = x.lb, m = x.m, st = x.st;
      const med3 = lb.med.r3, med1 = lb.med.r1;
      const under = st.score < 0.35 && m.r3 != null && med3 != null && m.r3 < med3 - 0.01;
      const tgt = R.best(x.catKey, x.hd.code);
      if (under && tgt) {
        const tx = x.tx, eq = x.cat.tax === 'equity';
        const ltPos = Math.max(0, tx.ltGain);
        const ltTax = eq ? Math.max(0, ltPos - room) * .125 : x.lots.filter(l => l.lt && l.gain > 0).reduce((a, l) => a + l.gain * l.rate, 0);
        const stTax = x.lots.filter(l => !l.lt && l.gain > 0 && !l.locked).reduce((a, l) => a + l.gain * l.rate, 0);
        const exitLoad = tx.exitLoadValue * .01;
        const gapR = Math.min(.06, Math.max(0, (tgt.m.r3 || 0) - m.r3));
        const impact = x.value * (Math.pow(1 + gapR / 2, 5) - 1);
        const steps = [];
        if (x.sipNow) steps.push(`SIP redirect: ${U.inr(x.sipNow)}/mahina ki SIP ${R.short(x.name)} me band karke ${R.short(tgt.name)} me shuru karo — turant, zero tax.`);
        const switchable = tx.ltValue - (x.lots.filter(l => l.lt && l.locked).reduce((a, l) => a + l.value, 0));
        if (switchable > 500) steps.push(`Abhi switch: 12+ mahine purane units ≈ ${U.inr(switchable)} → ${R.short(tgt.name)}. Est. tax ${U.inr(ltTax)}${eq && room > 0 ? ` (₹1.25L LTCG chhoot me se ${U.inr(Math.min(room, ltPos))} use hogi)` : ''}.`);
        if (tx.stValue - tx.lockedValue > 500) steps.push(`Baaki ≈ ${U.inr(tx.stValue - tx.lockedValue)} (naye units) ${tx.allLt ? U.fmtDate(tx.allLt) : 'LTCG hone'} ke baad switch karo — abhi karne par STCG ≈ ${U.inr(stTax)}${exitLoad > 0 ? ` + exit load ≈ ${U.inr(exitLoad)}` : ''} lagega.`);
        if (tx.lockedValue > 0) steps.push(`ELSS lock-in: ${U.inr(tx.lockedValue)} ${U.fmtDate(tx.lockFree)} se pehle switch nahi ho sakta.`);
        steps.push('Switch se pehle SID/factsheet me exit load, TER aur fund manager change confirm karo.');
        const reasons = [
          `3Y CAGR ${U.pct(m.r3)} vs category median ${U.pct(med3)} vs suggested fund ${U.pct(tgt.m.r3)}.`,
          `1Y return ${U.pct(m.r1)} vs median ${U.pct(med1)}; peer rank ${st.rank}/${st.of} (${M.cat(x.catKey).label}, ${R.plan()} plans).`,
          m.roll && tgt.m.roll ? `Rolling ${m.roll.win}Y avg ${U.pct(m.roll.avg)} (worst ${U.pct(m.roll.min)}) vs ${U.pct(tgt.m.roll.avg)} (worst ${U.pct(tgt.m.roll.min)}) — consistency ka farak.` : null,
          tgt.m.sharpe != null && m.sharpe != null ? `Risk-adjusted: Sharpe ${m.sharpe.toFixed(2)} vs ${tgt.m.sharpe.toFixed(2)}; max drawdown ${U.pct(m.dd)} vs ${U.pct(tgt.m.dd)}.` : null,
          'Same category me switch → client ka risk level same rehta hai, sirf fund quality improve hoti hai.'
        ].filter(Boolean);
        add({
          key: `switch:${x.hd.id}`, type: 'switch', pri: x.value > 100000 && st.score < .25 ? 3 : 2,
          title: `${R.short(x.name)} → ${R.short(tgt.name)}`,
          why: `Category me bottom ${Math.round((1 - st.score) * 100)}% — 3Y me ${U.pct(med3 - m.r3)} p.a. median se peeche.`,
          steps, reasons, impact, impactLabel: 'Illustrative 5Y extra (aadha past gap maan kar)',
          from: x.hd.code, to: tgt.code, amount: x.value,
          wa: `Namaste ${fname} ji,\n\nAapke portfolio review me dekha ki ${R.short(x.name)} pichhle 3 saal me apni category ke median se ${U.pct(med3 - m.r3)} saalana peeche hai. Main suggest kar raha hoon ki nayi SIP ${R.short(tgt.name)} me shift karein aur purane units tax-efficient tareeke se switch karein (pehle LTCG wale units). Kab baat kar sakte hain?` + R.sig()
        });
      } else if (st.score < 0.5 && m.r1 != null && med1 != null && m.r1 < med1 - 0.03) {
        add({
          key: `watch:${x.hd.id}`, type: 'watch', pri: 1, title: `${R.short(x.name)} — watch karo`,
          why: `1Y return ${U.pct(m.r1)} median ${U.pct(med1)} se kam, lekin long-term record theek hai.`,
          steps: ['Abhi switch mat karo — 1 saal ka underperformance akela kaafi reason nahi.', 'Agle quarter review me rolling returns dobara check karo.', x.sipNow ? 'Agar client nayi SIP add kare to category leader me karo.' : 'Fresh money category leader me lagao.'],
          reasons: [`3Y CAGR ${U.pct(m.r3)} vs median ${U.pct(med3)}.`, `Peer rank ${st.rank}/${st.of}.`], impact: 0
        });
      }
    });

    /* 2. TAX-GAIN HARVESTING (₹1.25L LTCG exemption per FY) */
    if (room > 5000) {
      let need = room; const picks = [];
      const cands = A.hs.filter(x => x.h && x.cat.tax === 'equity' && x.tx.ltGain > 0)
        .sort((a, b) => (b.tx.ltGain / b.tx.ltValue) - (a.tx.ltGain / a.tx.ltValue));
      cands.forEach(x => {
        if (need <= 0) return; let g = 0, v = 0;
        for (const l of x.lots) { // FIFO: oldest units go first
          if (!l.lt || l.locked) break;
          if (need - g <= 0) break;
          if (l.gain <= 0) { v += l.value; g += l.gain; continue; }
          const f = Math.min(1, (need - g) / l.gain); g += l.gain * f; v += l.value * f;
        }
        if (g > 1000) { picks.push({ x, g, v }); need -= g; }
      });
      const tot = picks.reduce((a, p) => a + p.g, 0);
      if (tot > 5000) {
        add({
          key: `harvest:${U.fyLabel()}`, type: 'harvest', pri: fyQ4 ? 3 : 2,
          title: `Tax-gain harvesting: ${U.inr(tot)} LTCG tax-free book karo`,
          why: `${U.fyLabel()} ki ₹1.25L LTCG chhoot me ${U.inr(room)} bacha hai — use nahi kiya to lapse.`,
          steps: [...picks.map(p => `${R.short(p.x.name)}: ≈ ${U.inr(p.v)} redeem karo (oldest units, gain ≈ ${U.inr(p.g)}).`),
            'Usi din / agle din wahi amount same fund me reinvest karo → cost price upar reset, future tax kam.',
            `Best timing: Feb–March, ${U.fmtDate(fyEnd)} se pehle (tab tak FY ke baaki gains clear hote hain).`],
          reasons: [`Equity LTCG pe 12.5% tax lagta hai sirf ₹1.25L/FY se upar.`, `Client ne is FY me ${U.inr(U.num(c.ltcgBooked))} LTCG pehle hi book kiya hai (CRM entry).`, `Har saal harvest karne se future me ${U.inr(tot * .125)} tak tax bachta hai.`, 'Redemption FIFO hota hai — sabse purane (LTCG) units hi pehle niklenge.'],
          impact: tot * .125, impactLabel: 'Future tax saved',
          wa: `Namaste ${fname} ji,\n\nIs financial year me aapke ${U.inr(tot)} tak ke long-term gains tax-free book ho sakte hain (₹1.25 lakh ki chhoot). Hum units redeem karke turant reinvest karenge — investment wahi rahega, lekin aage ka tax ≈ ${U.inr(tot * .125)} bachega. Isko ${U.fmtDate(fyEnd)} se pehle karna hai.` + R.sig()
        });
      }
    }

    /* 3. TAX-LOSS HARVESTING */
    const losers = A.hs.filter(x => x.h && x.gain < -5000);
    const stGains = A.hs.reduce((a, x) => a + Math.max(0, x.tx.stGain), 0);
    losers.forEach(x => add({
      key: `loss:${x.hd.id}:${U.fyLabel()}`, type: 'loss', pri: stGains > 20000 ? 2 : 1,
      title: `${R.short(x.name)}: ${U.inr(-x.gain)} loss book karke set-off`,
      why: 'Notional loss ko book karke capital gains tax kam ho sakta hai.',
      steps: [`Units redeem karo (loss ≈ ${U.inr(-x.gain)}), aur paisa same category ke dusre fund me lagao.`, 'Short-term loss STCG aur LTCG dono se set-off hota hai; long-term loss sirf LTCG se.', 'Exit load (12 mahine se kam) check karo.'],
      reasons: [`Holding XIRR ${U.pct(x.xirr)}.`, stGains > 0 ? `Client ke portfolio me ${U.inr(stGains)} unrealised STCG bhi hai.` : 'Abhi gains kam hain — FY-end tak hold karke decide karo.'],
      impact: Math.min(-x.gain, Math.max(stGains, 0)) * .2, impactLabel: 'Max tax set-off'
    }));

    /* 4. ASSET ALLOCATION REBALANCE */
    if (A.value > 50000) {
      const drift = A.exp.eq - prof.eq, amt = Math.abs(drift) * A.value;
      if (Math.abs(drift) >= .07) {
        const over = drift > 0, fast = mk && mk.hi <= -.10;
        const debtTgt = R.best(prof.key === 'C' || prof.key === 'MC' ? 'shortdur' : 'baf');
        const eqTgt = R.best(prof.key === 'A' || prof.key === 'MA' ? 'flexi' : 'aggr');
        add({
          key: `rebal:${U.todayKey().slice(0, 7)}`, type: 'rebalance', pri: Math.abs(drift) >= .15 ? 3 : 2,
          title: over ? `Equity ${U.pct(A.exp.eq, 0)} → ${U.pct(prof.eq, 0)}: ${U.inrS(amt)} profit book karo` : `Equity kam hai (${U.pct(A.exp.eq, 0)} vs ${U.pct(prof.eq, 0)}): ${U.inrS(amt)} add karo`,
          why: `${prof.name} profile ka target equity ${U.pct(prof.eq, 0)} hai; drift ${U.pctS(drift)}.`,
          steps: over ? [
            Math.abs(drift) < .12 ? `Pehle 6–12 mahine nayi SIPs ${debtTgt ? R.short(debtTgt.name) : 'debt/hybrid fund'} me bhejo — bina tax rebalance.` : `${U.inr(amt)} equity se ${debtTgt ? R.short(debtTgt.name) : 'Balanced Advantage / Short Duration fund'} me switch karo.`,
            `Switch ke liye sirf LTCG units use karo (₹1.25L tak tax-free).`,
            mk && mk.hi > -.03 ? `Market 52-week high ke paas hai (${U.pct(mk.hi)}) — profit booking ka accha time.` : 'Ek baar me karne ki jagah 2–3 tranche me karo.'
          ] : [
            `${U.inr(amt)} ko liquid/arbitrage se ${eqTgt ? R.short(eqTgt.name) : 'equity fund'} me STP: ${fast ? 3 : 6} mahine, ${U.inr(amt / (fast ? 3 : 6))}/mahina.`,
            fast ? `Market high se ${U.pct(mk.hi)} neeche hai — STP fast (3 mahine) rakho.` : 'STP se averaging milti hai, timing risk kam hota hai.'
          ],
          reasons: [`Effective equity exposure (hybrid ka equity part mila kar): ${U.pct(A.exp.eq)}; debt ${U.pct(A.exp.debt)}; gold ${U.pct(A.exp.gold)}.`, `Risk profile: ${prof.name} (score ${P.riskScore(c) ?? 'manual'}).`, over ? 'Zyada equity = profile se zyada risk; girawat me client panic kar sakta hai.' : 'Kam equity = goal ke liye zaroori growth nahi milegi.'],
          impact: amt, impactLabel: over ? 'Amount to move' : 'Amount to deploy',
          wa: `Namaste ${fname} ji,\n\nAapke portfolio me equity ka hissa ${U.pct(A.exp.eq, 0)} ho gaya hai jabki aapke risk profile ke hisaab se ${U.pct(prof.eq, 0)} hona chahiye. ${over ? 'Thoda profit book karke stable funds me shift karna sahi rahega.' : 'Equity badhane ka plan STP ke through bana sakte hain.'} Ek short call karein?` + R.sig()
        });
      }
      if (A.exp.gold < prof.gold - .03 && A.value > 200000) {
        const g = R.best('gold');
        add({ key: 'gold', type: 'rebalance', pri: 1, title: `Gold allocation ${U.pct(A.exp.gold, 0)} → ${U.pct(prof.gold, 0)}`, why: 'Gold equity crash me hedge ka kaam karta hai.', steps: [`${U.inr((prof.gold - A.exp.gold) * A.value)} gold FoF me — SIP ya 3–6 mahine ka STP.${g ? ' Option: ' + R.short(g.name) + '.' : ''}`], reasons: ['Gold ka equity se correlation kam hota hai — portfolio ki volatility ghatti hai.', 'Gold FoF: 24 mahine se zyada hold karne par 12.5% LTCG.'], impact: (prof.gold - A.exp.gold) * A.value, impactLabel: 'Amount to add' });
      }
    }

    /* 5. RISK MISMATCH */
    if (A.value > 50000 && A.smid > prof.smid + .05) {
      const heavy = A.hs.filter(x => ['small', 'mid', 'idxsmall', 'idxmid'].includes(x.catKey)).sort((a, b) => b.value - a.value);
      const alt = R.best(prof.key === 'A' ? 'flexi' : 'largemid') || R.best('flexi');
      add({
        key: 'risk:smid', type: 'risk', pri: A.smid > prof.smid + .15 ? 3 : 2,
        title: `Small+Mid cap ${U.pct(A.smid, 0)} — limit ${U.pct(prof.smid, 0)}`,
        why: `${prof.name} client ke liye small/mid exposure zyada hai.`,
        steps: [heavy[0] && heavy[0].sipNow ? `${R.short(heavy[0].name)} ki SIP ${alt ? R.short(alt.name) : 'Flexi/Large & Mid cap'} me redirect karo.` : `Nayi investment ${alt ? R.short(alt.name) : 'Flexi Cap'} me karo.`, `${U.inr((A.smid - prof.smid) * A.value)} small/mid se (LTCG units) diversified fund me switch karo.`],
        reasons: ['Small caps ne past corrections me 40–60% tak girawat dekhi hai.', `Portfolio ka look-through small ${U.pct(A.exp.small)}, mid ${U.pct(A.exp.mid)}.`],
        impact: (A.smid - prof.smid) * A.value, impactLabel: 'Excess exposure'
      });
    }
    if (A.exp.them > .12 && A.value > 50000) add({ key: 'risk:them', type: 'risk', pri: 2, title: `Sectoral/Thematic ${U.pct(A.exp.them, 0)} — 10% se zyada`, why: 'Ek sector par zyada daav concentration risk hai.', steps: ['Thematic funds ko total portfolio ke 10% tak limit karo.', 'Excess ko Flexi Cap me switch (LTCG units pehle).'], reasons: ['Sector cycles 3–5 saal underperform kar sakte hain.'], impact: (A.exp.them - .1) * A.value, impactLabel: 'Excess exposure' });

    /* 6. CONSOLIDATION */
    const byCat = {}; A.hs.forEach(x => { if (x.h && !['liquid', 'arbitrage', 'shortdur', 'corpbond', 'debt'].includes(x.catKey)) (byCat[x.catKey] = byCat[x.catKey] || []).push(x); });
    Object.entries(byCat).forEach(([k, arr]) => {
      if (arr.length < 2) return;
      arr.sort((a, b) => (b.st ? b.st.score : 0) - (a.st ? a.st.score : 0));
      const keep = arr[0];
      add({ key: `cons:${k}`, type: 'consolidate', pri: arr.length >= 3 ? 2 : 1, title: `${arr.length} ${M.cat(k).label} funds — ek me consolidate`, why: 'Same category ke funds me 50–70% stocks common hote hain.', steps: [`Keep: ${R.short(keep.name)}${keep.st ? ` (peer rank ${keep.st.rank})` : ''}.`, ...arr.slice(1).map(x => `${R.short(x.name)}: SIP ${keep ? 'redirect' : 'band'} karo; units LTCG hone par switch.`)], reasons: ['Kam funds = clear tracking, kam overlap, better review.'], impact: 0 });
    });
    if (A.hs.length > 9) add({ key: 'cons:many', type: 'consolidate', pri: 1, title: `${A.hs.length} funds — over-diversified`, why: '7–8 funds kaafi hain.', steps: ['Har category me best 1 fund rakho.'], reasons: ['Zyada funds index jaisa return dete hain, par active fund ka kharcha.'], impact: 0 });
    const amcTop = Object.entries(A.byAmc).sort((a, b) => b[1] - a[1])[0];
    if (amcTop && A.value > 500000 && amcTop[1] / A.value > .5) add({ key: 'cons:amc', type: 'consolidate', pri: 1, title: `${amcTop[0]}: ${U.pct(amcTop[1] / A.value, 0)} portfolio`, why: 'Ek AMC par zyada concentration.', steps: ['Nayi investments dusre AMCs ke top funds me.'], reasons: ['Fund house level risk (manager exit, investment style) diversify hota hai.'], impact: 0 });

    /* 7. GOALS */
    (c.goals || []).forEach(g => {
      const gp = P.goalPlan(g, A);
      if (gp.gap > 1000) {
        add({
          key: `goal:${g.id}`, type: 'goal', pri: gp.done < .6 && gp.yrs < 7 ? 3 : 2,
          title: `${g.name}: ${U.inrS(gp.gap)} ki kami`,
          why: `${Math.round(gp.done * 100)}% on track — ${gp.yrs.toFixed(1)} saal baaki.`,
          steps: [`Option A: SIP ${U.inr(gp.extraSip, 0)}/mahina aur badhao.`, gp.stepNeed != null ? `Option B: current SIP pe ${Math.ceil(gp.stepNeed * 100)}% annual step-up.` : 'Option B: lumpsum add + step-up mila kar.', 'SIP badhane ke liye: existing mandate limit check karo (zaroorat ho to naya mandate).'],
          reasons: [`Target aaj ${U.inr(U.num(g.target))} → ${(g.inflation ?? 6)}% inflation se ${U.inr(gp.future)} (${g.year}).`, `Current corpus ${U.inr(gp.corpus)} + SIP ${U.inr(gp.sip)}/mahina → projected ${U.inr(gp.proj)} @ ${U.pct(gp.r)} assumed return.`, gp.yrs < 5 ? 'Kam horizon — conservative return assume kiya gaya.' : `Return ${prof.name} profile ke hisaab se.`],
          impact: gp.gap, impactLabel: 'Goal shortfall',
          wa: `Namaste ${fname} ji,\n\nAapke "${g.name}" goal ka review kiya: ${g.year} tak ${U.inrS(gp.future)} chahiye (inflation ke saath), current plan se ≈ ${U.inrS(gp.proj)} banega. Gap bharne ke liye SIP ${U.inr(gp.extraSip, 0)}/mahina badhani hogi${gp.stepNeed != null ? ` ya har saal ${Math.ceil(gp.stepNeed * 100)}% step-up` : ''}. Kab discuss karein?` + R.sig()
        });
      }
    });

    /* 8. SIP STEP-UP / SIP INCREASE */
    if (A.sip > 0) {
      const noStep = A.hs.filter(x => x.sipNow && !(+x.hd.sip.stepUp > 0) && today - U.parseISO(x.hd.sip.start) > 330 * DAY);
      if (noStep.length) {
        const s = noStep.reduce((a, x) => a + x.sipNow, 0), r = prof.ret;
        const a0 = P.fvSip(s, r, 180, 0), a1 = P.fvSip(s, r, 180, .10);
        const anniv = noStep.filter(x => new Date(U.parseISO(x.hd.sip.start)).getUTCMonth() === mon);
        add({
          key: `step:${new Date(today).getUTCFullYear()}`, type: 'stepup', pri: anniv.length ? 3 : 2,
          title: `10% annual step-up: 15Y corpus ${U.inrS(a0)} → ${U.inrS(a1)}`,
          why: `${noStep.length} SIP (${U.inr(s)}/mahina) bina step-up ke chal rahi hai.`,
          steps: [`Is saal SIP ${U.inr(s)} → ${U.inr(s * 1.1)} (+${U.inr(s * .1)}/mahina).`, 'Har saal salary hike ke saath auto top-up (SIP top-up facility) on karo.', anniv.length ? `Is mahine SIP anniversary: ${anniv.map(x => R.short(x.name)).join(', ')}.` : 'Client ke appraisal month me yaad dilao.'],
          reasons: [`${U.pct(r)} assumed return (${prof.name}).`, `Extra ≈ ${U.inrS(a1 - a0)} sirf 10% saalana badhane se — income ke saath investment badhna chahiye.`],
          impact: a1 - a0, impactLabel: '15Y extra corpus',
          wa: `Namaste ${fname} ji,\n\nAapki SIP ${U.inr(s)} ko har saal sirf 10% badhaayen to 15 saal me corpus ${U.inrS(a0)} ki jagah ≈ ${U.inrS(a1)} ban sakta hai. Is saal ${U.inr(s * .1)}/mahina ka top-up karein?` + R.sig()
        });
      }
    }
    const inc = U.num(c.income), expn = U.num(c.expense);
    if (inc > 0) {
      const surplus = inc - expn - A.sip - U.num(c.emi);
      const ideal = inc * .2;
      if (A.sip < ideal && surplus > 3000) {
        const add_ = Math.round(Math.min(surplus * .5, ideal - A.sip) / 500) * 500;
        const upKey = A.value > 0 && A.exp.eq > prof.eq + .05 ? (prof.eq >= .5 ? 'baf' : 'shortdur') : (prof.eq >= .7 ? 'flexi' : 'aggr');
        if (add_ >= 500) add({
          key: `upsell:${U.todayKey().slice(0, 7)}`, type: 'upsell', pri: 2, title: `SIP ${U.inr(add_)}/mahina badhane ki capacity`,
          why: `SIP income ka ${U.pct(A.sip / inc, 0)} hai — 20% healthy benchmark.`,
          steps: [`Nayi SIP ${U.inr(add_)} — ${R.best(upKey) ? R.short(R.best(upKey).name) : M.cat(upKey).label + ' fund'}${upKey !== 'flexi' && upKey !== 'aggr' ? ' (equity already target se upar hai)' : ''}.`, 'Goal se link karo taaki client motivated rahe.'],
          reasons: [`Monthly surplus ≈ ${U.inr(surplus)} (income ${U.inr(inc)} − kharcha ${U.inr(expn)} − EMI ${U.inr(U.num(c.emi))} − SIP ${U.inr(A.sip)}).`, 'Sirf aadha surplus suggest kiya — buffer bacha rahe.'],
          impact: P.fvSip(add_, prof.ret, 120), impactLabel: '10Y value of extra SIP'
        });
      }
    }

    /* 9. ELSS / 80C (old regime only) */
    if (c.regime === 'old') {
      const gap = 150000 - U.num(c.c80);
      if (gap > 5000) {
        const fe = new Date(fyEnd), monthsLeft = Math.max(1, (fe.getUTCFullYear() - new Date(today).getUTCFullYear()) * 12 + fe.getUTCMonth() - mon + 1);
        const e = R.best('elss'); const saved = gap * slab * 1.04;
        add({
          key: `elss:${U.fyLabel()}`, type: 'elss', pri: fyQ4 ? 3 : 2, title: `80C gap ${U.inr(gap)} — ELSS se ${U.inr(saved)} tax bachao`,
          why: `Old regime, ${c.slab}% slab; ${U.fyLabel()} me ${U.inr(U.num(c.c80))} hi 80C use hua.`,
          steps: [`Lumpsum ${U.inr(gap)} ya SIP ${U.inr(Math.ceil(gap / monthsLeft / 100) * 100)}/mahina × ${monthsLeft} mahine (31 March tak).`, e ? `Fund: ${R.short(e.name)} (ELSS rank #${e.rank}).` : 'ELSS category leaderboard load karke fund choose karo.', '3 saal lock-in — client ko pehle batao.'],
          reasons: ['ELSS ka lock-in 80C options me sabse chhota (3 saal) hai aur equity growth milti hai.', `Tax saved = ${U.inr(gap)} × ${c.slab}% × 1.04 cess.`],
          impact: saved, impactLabel: 'Tax saved this FY',
          wa: `Namaste ${fname} ji,\n\nIs saal aapke 80C me ${U.inr(gap)} ki limit abhi baaki hai. ELSS me invest karke ≈ ${U.inr(saved)} tax bacha sakte hain (3 saal lock-in). 31 March se pehle plan kar lein?` + R.sig()
        });
      }
    }

    /* 10. EMERGENCY FUND */
    if (expn > 0) {
      const liquidHeld = A.hs.filter(x => ['liquid', 'arbitrage', 'shortdur'].includes(x.catKey)).reduce((a, x) => a + x.value, 0);
      const need = expn * 6, have = U.num(c.efund) + liquidHeld;
      if (have < need * .9) {
        const lq = R.best('liquid');
        add({ key: 'ef', type: 'emergency', pri: have < need * .4 ? 3 : 2, title: `Emergency fund ${U.inrS(have)} / ${U.inrS(need)}`, why: '6 mahine ke kharche ka cushion hona chahiye.', steps: [`${U.inr(need - have)} liquid fund me${lq ? ' (' + R.short(lq.name) + ')' : ''} — lumpsum ya 3–6 mahine me.`, 'Isse equity SIPs emergency me todni nahi padengi.'], reasons: [`Monthly kharcha ${U.inr(expn)} × 6 = ${U.inr(need)}.`, 'Liquid fund: T+1 redemption, FD se zyada flexible.'], impact: need - have, impactLabel: 'Amount to build' });
      }
    }

    /* 11. STP for idle cash */
    const idle = U.num(c.idle);
    if (idle >= 25000) {
      const months = mk && mk.hi <= -.10 ? 3 : mk && mk.hi <= -.05 ? 6 : 12;
      const overEq = A.value > 0 && A.exp.eq > prof.eq + .05;
      const tgtKey = overEq ? (prof.eq >= .5 ? 'baf' : 'shortdur') : prof.eq >= .7 ? 'flexi' : prof.eq >= .5 ? 'aggr' : 'baf';
      const src = slab >= .3 ? 'arbitrage' : 'liquid';
      const t = R.best(tgtKey), s = R.best(src);
      add({
        key: `stp:${U.todayKey().slice(0, 7)}`, type: 'stp', pri: idle >= 200000 ? 3 : 2, title: `${U.inrS(idle)} idle — ${months} mahine ka STP`,
        why: 'Bank me pada paisa inflation se kam kama raha hai.',
        steps: [`Step 1: ${U.inr(idle)} ${s ? R.short(s.name) : (src === 'arbitrage' ? 'Arbitrage fund' : 'Liquid fund')} me lumpsum.`, `Step 2: STP ${U.inr(idle / months)}/mahina → ${t ? R.short(t.name) : M.cat(tgtKey).label + ' fund'} for ${months} mahine.`, months === 3 ? 'Market correction me hai — fast deployment.' : months === 6 ? 'Market thoda neeche — medium pace.' : 'Market high ke paas — dheere deploy karo.'],
        reasons: [mk ? `Nifty 50 (index fund proxy) 52-week high se ${U.pct(mk.hi)}.` : 'Market data load nahi hua — default 12 mahine.', src === 'arbitrage' ? `${c.slab}% slab: arbitrage fund equity-taxed (STCG 20%) — liquid (slab rate) se better.` : 'Liquid fund: low risk, T+1 liquidity.', overEq ? `Portfolio me equity pehle se ${U.pct(A.exp.eq, 0)} (target ${U.pct(prof.eq, 0)}) — isliye naya paisa ${M.cat(tgtKey).label} me, taaki allocation balance ho.` : `Target ${M.cat(tgtKey).label} — ${prof.name} profile ke hisaab se.`],
        impact: idle, impactLabel: 'Amount to deploy',
        wa: `Namaste ${fname} ji,\n\nAapke paas jo ${U.inrS(idle)} abhi bank me pade hain, unhe ek baar me market me daalne ki jagah STP se ${months} mahine me invest karna behtar rahega — pehle ${src === 'arbitrage' ? 'arbitrage' : 'liquid'} fund, phir har mahine ${U.inr(idle / months)} equity me. Process shuru karein?` + R.sig()
      });
    }

    /* 12. SWP */
    const needM = U.num(c.swpNeed);
    if (needM > 0 && A.value > 0) {
      const rate = needM * 12 / A.value, gR = A.value ? Math.max(0, A.gain / A.value) : 0;
      const taxSwp = Math.max(0, needM * 12 * gR - 125000) * .125, fdTax = needM * 12 * slab;
      const b1 = needM * 24, b2 = needM * 36;
      const lq = R.best('shortdur') || R.best('liquid'), bf = R.best('baf');
      add({
        key: 'swp', type: 'swp', pri: rate > .07 ? 3 : 2, title: `SWP ${U.inr(needM)}/mahina — withdrawal rate ${U.pct(rate)}`,
        why: rate > .07 ? 'Withdrawal rate 7% se zyada — corpus jaldi khatam ho sakta hai.' : 'Sustainable range (≤6–7%) me hai.',
        steps: [`Bucket 1 (2 saal): ${U.inr(b1)} ${lq ? R.short(lq.name) : 'Short Duration / Liquid'} — SWP isi se.`, `Bucket 2 (3 saal): ${U.inr(Math.min(b2, Math.max(0, A.value - b1)))} ${bf ? R.short(bf.name) : 'Balanced Advantage'}.`, `Bucket 3: baaki ${U.inr(Math.max(0, A.value - b1 - b2))} equity me growth ke liye; saal me ek baar Bucket 1 refill.`, rate > .07 ? `Sustainable SWP ≈ ${U.inr(A.value * .06 / 12)}/mahina — client se expectation align karo.` : 'SWP date pension/rent cycle se match karo.'],
        reasons: [`SWP me sirf gain wala hissa taxable — est. tax ≈ ${U.inr(taxSwp)}/saal vs FD interest pe ≈ ${U.inr(fdTax)}/saal (${c.slab}% slab).`, 'Bucket strategy se market girne par equity bechni nahi padti.'],
        impact: Math.max(0, fdTax - taxSwp), impactLabel: 'Yearly tax vs FD'
      });
    }

    /* 13. MARKET MOVE */
    if (mk && mk.hi <= -.10 && A.value > 0) {
      add({
        key: `mkt:${U.todayKey().slice(0, 7)}`, type: 'market', pri: A.exp.eq > .5 ? 3 : 2, title: `Market ${U.pct(mk.hi)} neeche — reassurance + top-up`,
        why: 'Correction me client ka SIP band karna sabse badi galti hoti hai.',
        steps: ['Client ko call/WhatsApp: SIP continue rakhein — sasti NAV pe zyada units.', idle > 0 ? `Idle ${U.inrS(idle)} ka STP fast karo.` : 'Agar surplus ho to 1–2 extra SIP installment (top-up) suggest karo.', 'Drift check: equity profile target se kam hua ho to rebalance into equity.'],
        reasons: [`Nifty 50 proxy 52-week high se ${U.pct(mk.hi)}; 1 mahine me ${U.pctS(mk.r1m)}.`, 'SIP investors ko correction me average cost ka fayda milta hai.'],
        impact: 0,
        wa: `Namaste ${fname} ji,\n\nMarket apne high se ${U.pct(-mk.hi, 0)} neeche hai — ye normal correction hai. Aapki SIPs is samay kam NAV par zyada units kharid rahi hain, jo long-term me fayda deta hai. SIP band na karein; agar extra paisa ho to top-up ka bhi accha mauka hai.` + R.sig()
      });
    }

    /* 14. REVIEW & RELATIONSHIP */
    const lr = U.parseISO(c.lastReview);
    if (!lr || today - lr > 180 * DAY) add({ key: `review:${U.todayKey().slice(0, 7)}`, type: 'review', pri: lr ? 2 : 1, title: lr ? `Review ${Math.round((today - lr) / DAY)} din pehle hua tha` : 'Pehla portfolio review baaki', why: 'Har 6 mahine review = retention + naye business ka mauka.', steps: ['Meeting schedule karo; is app se client report PDF le jao.', 'Risk profile aur goals update karo.'], reasons: ['Regular review se client trust aur SIP continuity badhti hai.'], impact: 0, wa: `Namaste ${fname} ji,\n\nAapke portfolio ka half-yearly review due hai. Is hafte 20 minute ka time mil sakta hai?` + R.sig() });
    const dob = U.parseISO(c.dob);
    if (dob) {
      const d = new Date(dob), y = new Date(today).getUTCFullYear();
      let bd = Date.UTC(y, d.getUTCMonth(), d.getUTCDate()); if (bd < today) bd = Date.UTC(y + 1, d.getUTCMonth(), d.getUTCDate());
      const inDays = Math.round((bd - today) / DAY);
      if (inDays <= 7) add({ key: `bday:${y}`, type: 'birthday', pri: inDays <= 1 ? 2 : 1, title: inDays === 0 ? 'Aaj birthday hai!' : `Birthday ${inDays} din me (${U.fmtDate(bd)})`, why: 'Relationship touchpoint.', steps: ['Wish karo — saath me review ya step-up ki baat natural tareeke se.'], reasons: [], impact: 0, wa: `Happy Birthday ${fname} ji! 🎉 Aapka saal khushiyon aur achhe returns se bhara rahe.\n\n– ${App.state.settings.advisor || ''}` });
    }

    // apply status (done/dismissed/snoozed)
    const st = c.recs || {};
    out.forEach(r => { const s = st[r.key]; r.status = s ? (s.s === 'snooze' && s.until && U.parseISO(s.until) <= today ? 'open' : s.s) : 'open'; r.t = R.TYPES[r.type]; });
    return out.sort((a, b) => b.pri - a.pri || (b.impact || 0) - (a.impact || 0));
  }
};

/* ===== Tiny dependency-free SVG charts (Chart.js-like config subset) ===== */
const SC = {
  nice(min, max, n = 5) {
    if (min === max) { max = min + 1; min = min - 1; }
    const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const st = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => span / x <= n) || 10 * mag;
    const lo = Math.floor(min / st) * st, hi = Math.ceil(max / st) * st, t = [];
    for (let v = lo; v <= hi + st / 2; v += st) t.push(+v.toFixed(10));
    return t;
  },
  fmt(cb, v) { try { return cb ? cb(v) : (Math.abs(v) >= 1000 ? U.inrS(v).replace('₹', '') : +v.toFixed(2)); } catch (e) { return v; } },
  tip(cfg, ds, i, raw) {
    const cb = cfg.options && cfg.options.plugins && cfg.options.plugins.tooltip && cfg.options.plugins.tooltip.callbacks && cfg.options.plugins.tooltip.callbacks.label;
    const label = cfg.data.labels ? cfg.data.labels[i] : '';
    try { if (cb) return String(cb({ label, raw, dataset: ds, dataIndex: i })).trim(); } catch (e) { }
    return `${label}${ds.label ? ' · ' + ds.label : ''}: ${typeof raw === 'number' ? raw.toLocaleString('en-IN') : raw}`;
  },
  col(c, i) { return Array.isArray(c) ? c[i % c.length] : (c || '#0EA5E9'); },
  txt(x, y, s, o = {}) { return `<text x="${x}" y="${y}" font-size="${o.size || 10}" fill="${o.fill || '#64748B'}" text-anchor="${o.anchor || 'start'}" ${o.weight ? `font-weight="${o.weight}"` : ''} dominant-baseline="${o.base || 'middle'}">${U.esc(s)}</text>`; },
  render(el, cfg) {
    if (!el) return;
    const host = el.tagName === 'CANVAS' ? el.parentElement : el;
    const W = Math.max(120, host.clientWidth || 300), H = Math.max(40, host.clientHeight || 200);
    host.innerHTML = SC.svg(cfg, W, H);
    host.dataset.sc = '1';
  },
  svg(cfg, W, H) {
    const body = cfg.type === 'doughnut' ? SC.donut(cfg, W, H) : cfg.type === 'line' ? SC.line(cfg, W, H) : SC.bar(cfg, W, H);
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;font-family:Inter,system-ui,sans-serif;overflow:visible">${body}</svg>`;
  },
  legendItems(cfg) { return (cfg.data.datasets || []).map((d, i) => [d.label, d.borderColor && cfg.type === 'line' ? d.borderColor : SC.col(d.backgroundColor, 0)]); },
  legendTop(cfg, W) {
    const show = cfg.options && cfg.options.plugins && cfg.options.plugins.legend && cfg.options.plugins.legend.display;
    if (!show || cfg.type === 'doughnut') return { h: 0, s: '' };
    let x = 0, s = '';
    SC.legendItems(cfg).forEach(([l, c]) => { if (!l) return; s += `<rect x="${x}" y="2" width="10" height="10" rx="2" fill="${c}"/>` + SC.txt(x + 14, 7, l, { fill: '#334155' }); x += 24 + String(l).length * 6; });
    return { h: 18, s };
  },
  donut(cfg, W, H) {
    const ds = cfg.data.datasets[0], vals = ds.data.map(v => Math.max(0, +v || 0)), tot = vals.reduce((a, b) => a + b, 0);
    const legendRight = cfg.options && cfg.options.plugins && cfg.options.plugins.legend && cfg.options.plugins.legend.position === 'right';
    const cw = legendRight ? Math.min(W * .5, H) : W;
    const R = Math.min(cw, H) / 2 - 4, cx = (legendRight ? cw : W) / 2, cy = H / 2;
    const cut = parseFloat((cfg.options && cfg.options.cutout) || '60%') / 100, r0 = R * cut;
    let a = -Math.PI / 2, s = '';
    if (!tot) return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#F1F5F9"/><circle cx="${cx}" cy="${cy}" r="${r0}" fill="#fff"/>` + SC.txt(cx, cy, 'No data', { anchor: 'middle' });
    vals.forEach((v, i) => {
      if (!v) return; const f = v / tot; let b = a + f * Math.PI * 2; if (f >= .9999) b = a + Math.PI * 2 - 1e-4;
      const L = b - a > Math.PI ? 1 : 0, p = (r, t) => `${(cx + r * Math.cos(t)).toFixed(2)},${(cy + r * Math.sin(t)).toFixed(2)}`;
      s += `<path d="M${p(R, a)} A${R},${R} 0 ${L} 1 ${p(R, b)} L${p(r0, b)} A${r0},${r0} 0 ${L} 0 ${p(r0, a)} Z" fill="${SC.col(ds.backgroundColor, i)}" stroke="#fff" stroke-width="2"><title>${U.esc(SC.tip(cfg, ds, i, ds.data[i]))}</title></path>`;
      a = b;
    });
    if (legendRight) {
      const items = cfg.data.labels.map((l, i) => [l, SC.col(ds.backgroundColor, i), vals[i]]).filter(x => x[2] > 0).slice(0, 12);
      const lh = Math.min(18, (H - 8) / Math.max(1, items.length)); const y0 = (H - lh * items.length) / 2;
      items.forEach(([l, c], i) => { s += `<rect x="${cw + 12}" y="${y0 + i * lh + lh / 2 - 5}" width="10" height="10" rx="2" fill="${c}"/>` + SC.txt(cw + 27, y0 + i * lh + lh / 2, String(l).slice(0, 40), { fill: '#334155', size: 10 }); });
    }
    return s;
  },
  axisCb(cfg, ax) { const sc = cfg.options && cfg.options.scales && cfg.options.scales[ax]; return sc && sc.ticks && sc.ticks.callback; },
  axisOff(cfg, ax) { const sc = cfg.options && cfg.options.scales && cfg.options.scales[ax]; return sc && sc.display === false; },
  bar(cfg, W, H) {
    const horiz = cfg.options && cfg.options.indexAxis === 'y';
    const labels = cfg.data.labels || [], dss = cfg.data.datasets, n = labels.length, k = dss.length;
    const lg = SC.legendTop(cfg, W);
    const all = dss.flatMap(d => d.data.map(Number)).filter(isFinite);
    const ticks = SC.nice(Math.min(0, ...all), Math.max(0, ...all), horiz ? 4 : 5);
    const lo = ticks[0], hi = ticks[ticks.length - 1];
    let s = lg.s;
    if (horiz) {
      const cb = SC.axisCb(cfg, 'x'), lw = Math.min(W * .42, 8 + Math.max(...labels.map(l => String(l).length)) * 6);
      const top = lg.h + 2, bot = H - 18, x0 = lw, x1 = W - 8, band = (bot - top) / Math.max(1, n);
      const X = v => x0 + (v - lo) / (hi - lo) * (x1 - x0);
      ticks.forEach(t => { s += `<line x1="${X(t)}" x2="${X(t)}" y1="${top}" y2="${bot}" stroke="#F1F5F9"/>` + SC.txt(X(t), bot + 9, SC.fmt(cb, t), { anchor: 'middle' }); });
      labels.forEach((l, i) => {
        const y = top + i * band; s += SC.txt(x0 - 6, y + band / 2, String(l).length > lw / 6 ? String(l).slice(0, Math.floor(lw / 6) - 1) + '…' : l, { anchor: 'end', fill: '#334155' });
        const bh = Math.min(26, band * .72) / k;
        dss.forEach((d, j) => { const v = +d.data[i] || 0, a = X(Math.min(0, v)), b = X(Math.max(0, v)); s += `<rect x="${a}" y="${y + (band - bh * k) / 2 + j * bh}" width="${Math.max(1, b - a)}" height="${bh - 2}" rx="3" fill="${SC.col(d.backgroundColor, i)}"><title>${U.esc(SC.tip(cfg, d, i, d.data[i]))}</title></rect>`; });
      });
      return s;
    }
    const cb = SC.axisCb(cfg, 'y'), yOff = SC.axisOff(cfg, 'y'), xOff = SC.axisOff(cfg, 'x');
    const lw = yOff ? 2 : 8 + Math.max(...ticks.map(t => String(SC.fmt(cb, t)).length)) * 6;
    const top = lg.h + 6, bot = H - (xOff ? 4 : 20), x0 = lw, x1 = W - 4, band = (x1 - x0) / Math.max(1, n);
    const Y = v => bot - (v - lo) / (hi - lo) * (bot - top);
    if (!yOff) ticks.forEach(t => { s += `<line x1="${x0}" x2="${x1}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t === 0 ? '#CBD5E1' : '#F1F5F9'}"/>` + SC.txt(x0 - 6, Y(t), SC.fmt(cb, t), { anchor: 'end' }); });
    const every = Math.ceil(n / Math.max(1, Math.floor((x1 - x0) / 46)));
    labels.forEach((l, i) => {
      const x = x0 + i * band, bw = Math.min(28, band * .7) / k;
      dss.forEach((d, j) => { const v = +d.data[i] || 0, a = Y(Math.max(0, v)), b = Y(Math.min(0, v)); s += `<rect x="${x + (band - bw * k) / 2 + j * bw}" y="${a}" width="${Math.max(1, bw - 1)}" height="${Math.max(1, b - a)}" rx="3" fill="${SC.col(d.backgroundColor, i)}"><title>${U.esc(SC.tip(cfg, d, i, d.data[i]))}</title></rect>`; });
      if (!xOff && i % every === 0) s += SC.txt(x + band / 2, bot + 10, String(l).length > 12 ? String(l).slice(0, 11) + '…' : l, { anchor: 'middle', size: 9 });
    });
    return s;
  },
  line(cfg, W, H) {
    const labels = cfg.data.labels || [], dss = cfg.data.datasets, n = labels.length;
    const lg = SC.legendTop(cfg, W);
    const all = dss.flatMap(d => d.data.map(Number)).filter(isFinite);
    if (!all.length) return '';
    const yOff = SC.axisOff(cfg, 'y'), xOff = SC.axisOff(cfg, 'x'), cb = SC.axisCb(cfg, 'y');
    let mn = Math.min(...all), mx = Math.max(...all);
    const ticks = yOff ? [mn, mx] : SC.nice(mn, mx, 4); const lo = yOff ? mn - (mx - mn) * .05 : ticks[0], hi = yOff ? mx + (mx - mn) * .05 : ticks[ticks.length - 1];
    const lw = yOff ? 0 : 8 + Math.max(...ticks.map(t => String(SC.fmt(cb, t)).length)) * 6;
    const top = lg.h + (yOff ? 1 : 6), bot = H - (xOff ? 1 : 18), x0 = lw, x1 = W - (yOff ? 0 : 6);
    const X = i => x0 + (n <= 1 ? 0 : i / (n - 1)) * (x1 - x0), Y = v => bot - (v - lo) / ((hi - lo) || 1) * (bot - top);
    let s = lg.s;
    if (!yOff) ticks.forEach(t => { s += `<line x1="${x0}" x2="${x1}" y1="${Y(t)}" y2="${Y(t)}" stroke="#F1F5F9"/>` + SC.txt(x0 - 6, Y(t), SC.fmt(cb, t), { anchor: 'end' }); });
    dss.forEach(d => {
      const pts = d.data.map((v, i) => [X(i), Y(+v)]).filter(p => isFinite(p[1]));
      if (!pts.length) return;
      const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
      if (d.fill) s += `<path d="${path}L${pts[pts.length - 1][0].toFixed(1)},${bot}L${pts[0][0].toFixed(1)},${bot}Z" fill="${d.backgroundColor || 'rgba(14,165,233,.12)'}"/>`;
      s += `<path d="${path}" fill="none" stroke="${d.borderColor || '#0284C7'}" stroke-width="${d.borderWidth || 2}" ${d.borderDash ? `stroke-dasharray="${d.borderDash.join(' ')}"` : ''} stroke-linejoin="round"/>`;
    });
    if (!xOff) { const lim = Math.min(8, Math.floor((x1 - x0) / 70)) || 2, every = Math.max(1, Math.ceil(n / lim)); for (let i = 0; i < n; i += every) s += SC.txt(X(i), bot + 10, labels[i], { anchor: i === 0 ? 'start' : 'middle', size: 9 }); }
    const tipOn = !(cfg.options && cfg.options.plugins && cfg.options.plugins.tooltip && cfg.options.plugins.tooltip.enabled === false);
    if (tipOn && n > 1) { const w = (x1 - x0) / (n - 1); for (let i = 0; i < n; i++) s += `<rect x="${X(i) - w / 2}" y="${top}" width="${w}" height="${bot - top}" fill="transparent"><title>${U.esc(labels[i] + '\n' + dss.map(d => SC.tip(cfg, d, i, d.data[i])).join('\n'))}</title></rect>`; }
    return s;
  }
};

/* --- app.js --- */
/* ===== App core: state, data loading, routing, actions ===== */
const PALETTE = ['#0284C7', '#38BDF8', '#6366F1', '#14B8A6', '#F59E0B', '#EC4899', '#84CC16', '#0C4A6E', '#A78BFA', '#FB7185', '#94A3B8', '#22D3EE'];
const App = {
  KEY: 'smcrm_v1',
  state: null, analysis: new Map(), recIdx: new Map(), market: null, mkt: {}, charts: {},
  route: 'dashboard', param: null, ctab: 'overview', loading: null, peerProg: null,
  oppFilter: { type: '', pri: '', status: 'open', q: '' },
  DEFAULTS: () => ({ v: 1, settings: { firm: 'Shaiv Market', advisor: 'Chirag Sharma', arn: 'ARN-337289', phone: '9950653247', city: 'Jaipur', trail: 0.8, plan: 'regular', rf: 6.5, pin: null }, clients: [] }),

  load() {
    const s = U.ls.get(App.KEY), d = App.DEFAULTS();
    App.state = s ? { ...d, ...s, settings: { ...d.settings, ...(s.settings || {}) } } : d;
  },
  save() { App.state.savedAt = Date.now(); if (!U.ls.set(App.KEY, App.state)) U.toast('⚠ Browser storage blocked/full — Settings se Backup export karo'); },
  client: id => App.state.clients.find(c => c.id === id),

  async init() {
    App.load();
    document.addEventListener('click', App.onClick);
    window.addEventListener('hashchange', () => App.go(location.hash));
    window.addEventListener('resize', U.debounce(() => App.rerenderCharts(), 250));
    if (App.state.settings.pin) V.lock(); else App.start();
  },
  start() {
    App.go(location.hash || '#dashboard');
    App.refreshData();
  },
  go(hash) {
    const h = String(hash || '').replace('#', '') || 'dashboard';
    if (h.startsWith('c-')) { App.route = 'client'; App.param = h.slice(2); }
    else if (h.startsWith('f-')) { App.route = 'fund'; App.param = h.slice(2); }
    else { App.route = ['dashboard', 'clients', 'opps', 'funds', 'tools', 'settings'].includes(h) ? h : 'dashboard'; App.param = null; }
    App.render(); window.scrollTo(0, 0);
  },
  nav(h) { if (location.hash === '#' + h) App.go('#' + h); else location.hash = h; },

  render() {
    Object.values(App.charts).forEach(c => { try { c.destroy(); } catch (e) { } }); App.charts = {};
    const open = App.allRecs().filter(r => r.status === 'open' && r.pri === 3).length;
    U.$$('[data-nav]').forEach(a => { a.classList.toggle('on', a.dataset.nav === App.route || (App.route === 'client' && a.dataset.nav === 'clients') || (App.route === 'fund' && a.dataset.nav === 'funds')); const c = a.querySelector('.cnt'); if (c) { c.textContent = open; c.classList.toggle('hide', !open || a.dataset.nav !== 'opps'); } });
    const main = U.$('#main');
    try { main.innerHTML = V[App.route] ? V[App.route]() : V.dashboard(); } catch (e) { console.error(e); main.innerHTML = `<div class="card"><b>Render error:</b> ${U.esc(e.message)}</div>`; }
    requestAnimationFrame(() => { try { V.after && V.after(); } catch (e) { console.error(e); } });
  },
  chart(id, cfg) {
    const el = document.getElementById(id); if (!el) return null;
    cfg.options = cfg.options || {}; cfg.options.plugins = cfg.options.plugins || {};
    const host = el.tagName === 'CANVAS' ? el.parentElement : el;
    host.id = host.id || ('h_' + id);
    SC.render(el, cfg);
    App.charts[id] = { host, cfg, destroy() { } };
    return App.charts[id];
  },
  rerenderCharts() { Object.values(App.charts).forEach(c => { if (document.body.contains(c.host)) SC.render(c.host, c.cfg); }); },

  /* ---------- data ---------- */
  codes() { return [...new Set(App.state.clients.flatMap(c => c.holdings.map(h => String(h.code))))]; },
  async refreshData(force = false) {
    const codes = App.codes();
    App.loading = { done: 0, total: codes.length + 3, msg: 'Live NAV fetch ho rahi hai…' }; V.status();
    await Promise.allSettled([
      ...codes.map(c => API.history(c, 'full', force).finally(() => { App.loading.done++; V.status(); })),
      App.loadMarket(force).finally(() => { App.loading.done += 3; V.status(); })
    ]);
    App.loading = null; App.recompute(); App.render(); V.status();
  },
  async loadMarket(force) {
    const defs = [['n50', 'Nifty 50', ['UTI Nifty 50 Index', 'HDFC Nifty 50 Index']], ['mid', 'Midcap 150', ['Motilal Oswal Nifty Midcap 150', 'Nippon India Nifty Midcap 150']], ['small', 'Smallcap 250', ['Nippon India Nifty Smallcap 250', 'Motilal Oswal Nifty Smallcap 250']]];
    const mc = App.state.mkcodes || {};
    await Promise.allSettled(defs.map(async ([k, label, qs]) => {
      let code = mc[k];
      if (!code) for (const q of qs) { try { const p = API.pickPlan(await API.search(q), 'direct'); if (p) { code = p.schemeCode; break; } } catch (e) { } }
      if (!code) return;
      mc[k] = code;
      const h = await API.history(code, 'full', force);
      App.mkt[k] = { label, code, h, m: M.compute(h), hi: M.fromHigh(h) };
    }));
    App.state.mkcodes = mc; App.save();
    const n = App.mkt.n50;
    App.market = n ? { hi: n.hi.dd, r1m: n.m.r1m, r1: n.m.r1, r3m: n.m.r3m, asOf: n.h.lastT } : null;
  },
  recompute() {
    App.analysis.clear(); App.recIdx.clear();
    App.state.clients.forEach(c => {
      try {
        const A = P.analyze(c, { lbs: true });
        const recs = R.forClient(c, A);
        App.analysis.set(c.id, { A, recs });
        recs.forEach(r => App.recIdx.set(c.id + '|' + r.key, r));
      } catch (e) { console.error('analyze', c.name, e); }
    });
  },
  allRecs() { return [...App.analysis.values()].flatMap(x => x.recs); },
  A: id => (App.analysis.get(id) || {}).A,
  book() {
    let aum = 0, inv = 0, sip = 0; const byCat = {}, byProf = {}, byClient = [];
    App.state.clients.forEach(c => { const A = App.A(c.id); if (!A) return; aum += A.value; inv += A.invested; sip += A.sip; byClient.push([c.name, A.value]); byProf[A.profile.name] = (byProf[A.profile.name] || 0) + 1; for (const k in A.byCat) byCat[k] = (byCat[k] || 0) + A.byCat[k]; });
    return { aum, inv, sip, byCat, byProf, byClient: byClient.sort((a, b) => b[1] - a[1]), trail: aum * (App.state.settings.trail || 0) / 100 };
  },
  peerNeeded() {
    const s = new Set(['flexi', 'elss', 'liquid', 'baf', 'aggr']);
    App.analysis.forEach(({ A }) => A.hs.forEach(x => { if (x.h && M.SCREEN.includes(x.catKey)) s.add(x.catKey); }));
    const plan = App.state.settings.plan;
    return { all: [...s], missing: [...s].filter(k => !M.lbCached(k, plan)) };
  },
  async loadPeers(keys, force = false) {
    if (App.peerProg) return;
    App.peerProg = { i: 0, n: keys.length, msg: 'Scheme list download ho rahi hai (pehli baar ~1 min)…' }; V.peerBar(); const errs = [];
    try { await API.list(); } catch (e) { errs.push('AMFI scheme list download fail: ' + e.message); }
    for (const k of keys) {
      App.peerProg.i++;
      try { await M.leaderboard(k, App.state.settings.plan, (msg, f) => { App.peerProg.msg = msg; App.peerProg.f = f; V.peerBar(); }, force); } catch (e) { console.error(e); errs.push(e.message); }
    }
    App.peerProg = null; App.recompute(); App.render();
    if (errs.length) V.modal('Peer rankings — kuch categories load nahi hui', `<ul>${errs.map(x => `<li>${U.esc(x)}</li>`).join('')}</ul><div class="note">Settings → "Data check" chala kar dekho live API tak pahunch rahe hain ya nahi.</div>`, `<button class="btn pri" data-act="closeModal">OK</button>`);
    else U.toast('Peer rankings ready ✓');
  },

  /* ---------- mutations ---------- */
  upsertClient(c) { const i = App.state.clients.findIndex(x => x.id === c.id); if (i >= 0) App.state.clients[i] = c; else App.state.clients.push(c); App.save(); },
  log(c, text) { (c.log = c.log || []).unshift({ at: Date.now(), text }); },
  setRec(cid, key, s, days) {
    const c = App.client(cid); if (!c) return; c.recs = c.recs || {};
    if (s === 'open') delete c.recs[key];
    else c.recs[key] = { s, at: U.todayKey(), until: days ? U.iso(U.today() + days * DAY) : null };
    const r = App.recIdx.get(cid + '|' + key);
    if (r && s !== 'open') App.log(c, `${s === 'done' ? '✅ Done' : s === 'snooze' ? '⏰ Snoozed' : '✖ Dismissed'}: ${r.title}`);
    App.save(); App.recompute(); App.render();
  },

  onClick(e) {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act, d = el.dataset;
    const fn = ACT[a]; if (fn) { e.preventDefault(); fn(d, el, e); }
  }
};

/* ---------- action handlers ---------- */
const ACT = {

  refresh: () => { U.toast('Live NAV refresh…'); App.refreshData(true); },

  peerOne: d => App.loadPeers([d.key], !!d.force),
  ctab: d => { App.ctab = d.tab; App.render(); },
  rec: d => App.setRec(d.cid, d.key, d.op, d.op === 'snooze' ? 30 : 0),

  addClient: () => F.client(),

  addHolding: d => F.holding(App.client(d.cid)),
  editHolding: d => { const c = App.client(d.cid); F.holding(c, c.holdings.find(h => h.id === d.hid)); },
  addGoal: d => F.goal(App.client(d.cid)),
  editGoal: d => { const c = App.client(d.cid); F.goal(c, (c.goals || []).find(g => g.id === d.gid)); },
  addNote: d => { const c = App.client(d.cid), t = U.$('#noteIn'); if (!t || !t.value.trim()) return; App.log(c, t.value.trim()); App.save(); App.render(); },
  markReview: d => { const c = App.client(d.cid); c.lastReview = U.todayKey(); App.log(c, '📋 Portfolio review done'); App.save(); App.recompute(); App.render(); U.toast('Review date updated'); },
  report: d => V.report(App.client(d.cid)),
  closeModal: () => V.close(),
  oppF: (d, el) => { App.oppFilter[d.f] = d.v; App.render(); },

  fundRange: d => { App.fundRange = +d.v; App.render(); },
  lbCat: d => { App.lbCat = d.key; App.render(); },
  openFund: d => App.nav('f-' + d.code),
  demo: () => DEMO.load(),
  exportJson: () => U.download(`mfd-crm-backup-${U.todayKey()}.json`, JSON.stringify(App.state, null, 1)),
  importJson: () => U.$('#fileJson').click(),
  importCsv: () => U.$('#fileCsv').click(),
  csvTemplate: () => U.download('holdings-template.csv', IMP.template, 'text/csv'),
  setPin: () => F.pin(),
  clearAll: () => V.confirm('Saara data delete karein?', 'Pehle backup export kar lo. Ye undo nahi hoga.', () => { App.state = App.DEFAULTS(); App.save(); U.idb.clear(); App.recompute(); App.nav('dashboard'); }),
  clearCache: () => { U.idb.clear(); Object.keys(localStorage).filter(k => /^lb\d:/.test(k)).forEach(k => U.ls.del(k)); M.lbMem = {}; API.mem.clear(); API._list = null; API._listP = null; U.toast('Cache cleared'); App.refreshData(true); },
  dataCheck: async () => {
    const row = (ok, t, d) => `<div class="row" style="padding:8px 0;border-bottom:1px solid #F1F5F9;align-items:flex-start"><span class="pill ${ok === true ? 'st-done' : ok === false ? 'p3' : 'p2'}">${ok === true ? 'OK' : ok === false ? 'FAIL' : 'WARN'}</span><div><b>${t}</b><div class="small mute">${d}</div></div></div>`;
    V.modal('Data check', '<div id="dc">Checking…</div>', `<button class="btn pri" data-act="closeModal">OK</button>`);
    const out = [], put = () => { const e = U.$('#dc'); if (e) e.innerHTML = out.join(''); };
    const proto = location.protocol;
    out.push(row(/^https?:$/.test(proto) ? true : null, 'Page kahan se khula', /^https?:$/.test(proto) ? location.host : `${proto} — phone ke file manager se khula hai. Kuch phones me data save/fetch nahi hota; hosted link (https) best hai.`)); put();
    let st = false; try { localStorage.setItem('_t', '1'); st = localStorage.getItem('_t') === '1'; localStorage.removeItem('_t'); } catch (e) { }
    out.push(row(st, 'Data save (browser storage)', st ? 'Client data is browser me save ho raha hai.' : 'Storage block hai — app band karte hi data chala jayega. Hosted link se kholo.')); put();
    try { const t0 = Date.now(); const rows = await API.list(true); out.push(row(true, 'AMFI scheme list', `${rows.length.toLocaleString('en-IN')} schemes · ${((Date.now() - t0) / 1000).toFixed(1)}s`)); }
    catch (e) { out.push(row(false, 'AMFI scheme list', U.esc(e.message) + ' — internet / browser fetch block.')); } put();
    try { const h = await API.history(122640, 'full', true); const age = Math.round((U.today() - h.lastT) / DAY); out.push(row(age <= 4, 'Live NAV test (PPFAS Flexi Cap Regular)', `NAV ₹${h.lastV.toFixed(4)} · ${U.fmtDate(h.lastT)}${age > 4 ? ` — ${age} din purani!` : ''}`)); }
    catch (e) { out.push(row(false, 'Live NAV test', U.esc(e.message))); } put();
    const stale = []; App.state.clients.forEach(c => c.holdings.forEach(hd => { const h = API.mem.get('hf:' + hd.code); const age = h ? Math.round((U.today() - h.lastT) / DAY) : null; if (!h || age > 4) stale.push(`${U.esc(c.name)} — ${U.esc(R.short(hd.name))}: ${h ? 'NAV ' + U.fmtDate(h.lastT) : 'NAV nahi aayi'}`); }));
    out.push(row(!stale.length, 'Client holdings NAV freshness', stale.length ? stale.slice(0, 15).join('<br>') : `Saare ${App.codes().length} funds ki NAV fresh hai (4 din ke andar).`)); put();
  },
  saveSettings: () => { const s = App.state.settings; U.$$('[data-set]').forEach(i => { s[i.dataset.set] = i.type === 'number' ? U.num(i.value) : i.value; }); App.save(); App.recompute(); App.render(); U.toast('Settings saved ✓'); }
};

  upcoming() {
    const today = U.today(), items = [];
    App.state.clients.forEach(c => {
      c.holdings.forEach(h => { if (h.sip && h.sip.amount > 0 && h.sip.active !== false && h.sip.day) { const d = new Date(today); let t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), Math.min(+h.sip.day, U.dim(d.getUTCFullYear(), d.getUTCMonth()))); if (t < today) { const nm = d.getUTCMonth() + 1; t = Date.UTC(d.getUTCFullYear() + (nm > 11 ? 1 : 0), nm % 12, Math.min(+h.sip.day, U.dim(d.getUTCFullYear() + (nm > 11 ? 1 : 0), nm % 12))); } if (t - today <= 7 * DAY) items.push([t, `${I('flow')} <a href="#c-${c.id}">${U.esc(c.name)}</a> SIP ${U.inr(h.sip.amount)} <span class="mute">· ${R.short(h.name)}</span>`]); } });
      const dob = U.parseISO(c.dob); if (dob) { const d = new Date(dob), y = new Date(today).getUTCFullYear(); let b = Date.UTC(y, d.getUTCMonth(), d.getUTCDate()); if (b < today) b = Date.UTC(y + 1, d.getUTCMonth(), d.getUTCDate()); if (b - today <= 7 * DAY) items.push([b, `${I('gift')} <a href="#c-${c.id}">${U.esc(c.name)}</a> birthday`]); }

  growth(A) {
    const hs = A.hs.filter(x => x.h && x.lots.length); if (!hs.length) return null;
    const t0 = Math.min(...hs.map(x => x.lots[0].t)), end = U.today();
    const step = Math.max(1, Math.round((end - t0) / DAY / 30.44 / 60));
    const t = [], val = [], inv = [];
    const d0 = new Date(t0); let y = d0.getUTCFullYear(), m = d0.getUTCMonth();
    for (let k = 0; k < 400; k++) {
      let tt = Date.UTC(y, m + 1, 0); if (tt > end) tt = end;
      let v = 0, iv = 0;
      hs.forEach(x => { const nav = M.navOn(x.h, tt) || 0; x.lots.forEach(l => { if (l.t <= tt) { v += l.units * nav; iv += l.amt; } }); });
      t.push(tt); val.push(Math.round(v)); inv.push(Math.round(iv));
      if (tt >= end) break;
      m += step; while (m > 11) { m -= 12; y++; }
    }
    return { t, val, inv };
  },

      ${fi('c80', '80C already used (old regime)', 'number')}${fi('ltcgBooked', 'Equity LTCG already booked this FY', 'number')}
      <div class="sec">${I('shield')} Risk profiling questionnaire</div>

      <label class="l">Manual override <small>(optional)</small><select class="in" name="riskOverride"><option value="">Auto (score se)</option>${P.PROFILES.map(p => `<option value="${p.key}" ${c.riskOverride === p.key ? 'selected' : ''}>${p.name}</option>`).join('')}</select></label>
      <div class="note" style="grid-column:1/-1" id="rqScore"></div>

    V.modal(isNew ? 'Naya client' : 'Edit — ' + U.esc(c.name), body, `<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" id="cSave">${I('check')} Save</button>`, m => {
      const upd = () => { const tmp = { risk: {} }; P.RISK_Q.forEach(q => { const v = +F.val(m, `[name=rq_${q.id}]`); if (v) tmp.risk[q.id] = v; }); tmp.riskOverride = F.val(m, '[name=riskOverride]'); const s = P.riskScore(tmp), p = P.profileOf(tmp); U.$('#rqScore', m).innerHTML = `Score: <b>${s ?? '— (kam se kam 4 answers)'}</b> /40 → <b>${p.name}</b> · target equity ${U.pct(p.eq, 0)}, small+mid max ${U.pct(p.smid, 0)}`; };
      m.addEventListener('change', upd); upd();
